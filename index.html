<script>
/* ============================================================
   UNI NOTES — AUTOMAZIONE AI IN BACKGROUND (Ollama)
   ------------------------------------------------------------
   Workflow per ogni lezione, una sola volta:
   1) legge esclusivamente il PDF principale;
   2) genera esclusivamente "Riepilogo AI.md";
   3) può aggiornare il titolo della lezione in base al PDF;
   4) marca la lezione come completata in .lesson.json.
   Gli altri file grezzi, inclusi gli audio, non vengono letti, rinominati o modificati.
   Il processo può essere interrotto e ripreso.
   ============================================================ */
(function(){
  'use strict';


  const AI_SUMMARY_LANGUAGES = {
  it: { label:'Italiano', instruction:'italiano' },
  en: { label:'English', instruction:'inglese' },
  es: { label:'Español', instruction:'spagnolo' },
  fr: { label:'Français', instruction:'francese' },
  de: { label:'Deutsch', instruction:'tedesco' }
};
window.UniNotesAISummaryLanguages = AI_SUMMARY_LANGUAGES;

const AI_SUMMARY_FOLDER_NAME = 'Riepiloghi AI';
  const AI_SUMMARY_FILE_NAME = 'Riepilogo AI.md';
  const AI_AUTOMATION_VERSION = 4;
  const AI_MAX_FULL_PDF_TEXT = 64000;
  const AI_CHUNK_SIZE = 18000;

  function aiEnabled(){ return localStorage.getItem('uninotes.aiBackgroundEnabled') !== '0'; }
  function aiModel(){ return typeof OllamaManager !== 'undefined' ? OllamaManager.getModel() : ''; }
  function aiSummaryLanguage(){
    const raw = localStorage.getItem('uninotes.aiSummaryLanguage') || 'it';
    return AI_SUMMARY_LANGUAGES[raw] ? raw : 'it';
  }
  function aiSummaryLanguageInfo(){ return AI_SUMMARY_LANGUAGES[aiSummaryLanguage()]; }
  function aiSafeText(v){ return String(v == null ? '' : v).replace(/\u0000/g, '').trim(); }
  function aiAbortError(){
    const e = new Error('Elaborazione AI interrotta dall’utente.');
    e.name = 'AbortError';
    return e;
  }
  function aiThrowIfAborted(signal){
    if(signal && signal.aborted) throw aiAbortError();
  }

  async function aiReadMeta(lesson){
    try{
      const h=await lesson.handle.getFileHandle('.lesson.json');
      return JSON.parse(await FileSystemManager.readTextFile(h));
    }catch(e){ return {}; }
  }

  async function aiPersist(lesson, patch){
    const h=await FileSystemManager.getOrCreateFile(lesson.handle,'.lesson.json');
    let meta={}; try{ meta=JSON.parse(await FileSystemManager.readTextFile(h)); }catch(e){}
    Object.keys(patch||{}).forEach(k=>{ if(k!=='aiAutomation') meta[k]=patch[k]; });
    if(patch.aiAutomation){
      meta.aiAutomation=Object.assign({},meta.aiAutomation||{},patch.aiAutomation);
      lesson.aiAutomation=Object.assign({},lesson.aiAutomation||{},patch.aiAutomation);
    }
    if(Object.prototype.hasOwnProperty.call(patch,'title')) lesson.title=patch.title;
    if(Object.prototype.hasOwnProperty.call(patch,'aiSummaryFileName')) lesson.aiSummaryFileName=patch.aiSummaryFileName;
    await FileSystemManager.writeTextFile(h,JSON.stringify(meta,null,2));
  }

  async function aiGetSummaryFile(lesson, {create=false, migrateLegacy=true}={}){
    let folder=null, summary=null;

    // Prima prova a ottenere la cartella dedicata. In modalità create=true
    // viene creata in modo esplicito; non consideriamo la sua sola creazione
    // come creazione del file Markdown.
    try{
      folder = await lesson.handle.getDirectoryHandle(AI_SUMMARY_FOLDER_NAME,{create:!!create});
    }catch(e){
      folder=null;
    }

    if(folder){
      try{
        // Questo è il punto corretto per creare davvero il riepilogo.
        summary = await folder.getFileHandle(AI_SUMMARY_FILE_NAME,{create:!!create});
      }catch(e){
        summary=null;
      }
    }

    // Migrazione trasparente dei vecchi riepiloghi che si trovavano nella
    // root della lezione. La migrazione avviene anche quando la cartella non
    // esiste ancora. Non perdiamo mai il file originale se la copia fallisce.
    if(!summary && migrateLegacy){
      let legacy=null;
      try{ legacy=await lesson.handle.getFileHandle(AI_SUMMARY_FILE_NAME); }catch(e){ legacy=null; }
      if(legacy){
        try{
          if(!folder) folder=await lesson.handle.getDirectoryHandle(AI_SUMMARY_FOLDER_NAME,{create:true});
          const fileObj=await legacy.getFile();
          const target=await folder.getFileHandle(AI_SUMMARY_FILE_NAME,{create:true});
          const writable=await target.createWritable();
          try{
            await writable.write(await fileObj.arrayBuffer());
          }finally{
            try{ await writable.close(); }catch(e){}
          }
          summary=target;
          try{ await lesson.handle.removeEntry(AI_SUMMARY_FILE_NAME); }catch(e){ /* la copia valida resta comunque disponibile */ }
        }catch(e){
          summary=null;
        }
      }
    }

    if(summary){
      lesson.aiSummaryFile={name:AI_SUMMARY_FILE_NAME,handle:summary,kind:'text',folder:AI_SUMMARY_FOLDER_NAME};
      lesson.aiSummaryFileName=AI_SUMMARY_FILE_NAME;
    }
    return summary;
  }

  async function aiSummaryIsValid(lesson, handle){
    if(!handle) return false;
    try{
      const text=await FileSystemManager.readTextFile(handle);
      return aiSafeText(text).length >= 200;
    }catch(e){ return false; }
  }


  async function aiEnsureSummaryFile(lesson, markdown, signal){
    aiThrowIfAborted(signal);
    const handle=await aiGetSummaryFile(lesson,{create:true,migrateLegacy:true});
    if(!handle) throw new Error('Impossibile creare il file Riepilogo AI.md nella cartella Riepiloghi AI.');
    const clean=aiCleanMarkdown(markdown);
    if(clean.length < 200) throw new Error('Il riepilogo generato è troppo breve o vuoto.');
    aiThrowIfAborted(signal);
    await FileSystemManager.writeTextFile(handle,clean);
    aiThrowIfAborted(signal);
    const verify=await FileSystemManager.readTextFile(handle);
    if(aiSafeText(verify).length < 200) throw new Error('Riepilogo AI.md creato ma la verifica del contenuto non è riuscita.');

  async function aiIdleYield(){

    else await aiYield(100);

  function aiExtractJsonObject(content){
    const raw=String(content||'').trim();
    if(!raw) return null;
    const candidates=[];
    candidates.push(raw);
    const fenced=raw.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
    if(fenced) candidates.push(fenced[1].trim());
    const first=raw.indexOf('{'), last=raw.lastIndexOf('}');
    if(first>=0&&last>first) candidates.push(raw.slice(first,last+1));
    for(const candidate of candidates){
      try{
        const parsed=JSON.parse(candidate);
        if(parsed&&typeof parsed==='object') return parsed;
      }catch(e){}
    }
    return null;
  }

  async function aiOllamaJson(messages, signal, schema){
    aiThrowIfAborted(signal);
    const model=aiModel(); if(!model) throw new Error('Nessun modello Ollama selezionato.');
    const profile=aiResourceProfile();
    const requestBody={
      model, messages, stream:false, format: schema || 'json', think:false, keep_alive:profile.keepAlive,
      options:{temperature:0.1,num_ctx:profile.numCtx,num_predict:profile.numPredict}
    };
    const doRequest=async(body)=>{
      const res=await fetch(OllamaManager.baseUrl+'/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
        signal
      });
      aiThrowIfAborted(signal);
      if(!res.ok){ const t=await res.text().catch(()=> ''); throw new Error('Ollama HTTP '+res.status+(t?': '+t.slice(0,160):'')); }
      const data=await res.json();
      aiThrowIfAborted(signal);
      return data&&data.message?String(data.message.content||''):'';
    };

    let content=await doRequest(requestBody);
    let parsed=aiExtractJsonObject(content);
    if(parsed) return parsed;

    // Alcuni modelli dichiarano supporto JSON ma occasionalmente restituiscono testo non conforme.
    // Un singolo retry più vincolante evita di bloccare l'intera coda senza moltiplicare il carico.
    await aiYield(350);
    aiThrowIfAborted(signal);
    const retryMessages=[...messages];
    const last=retryMessages.length-1;
    retryMessages.push({
      role:'user',
      content:'ATTENZIONE: la risposta precedente non era JSON valido. Rispondi ADESSO esclusivamente con un oggetto JSON valido, senza markdown fence, testo introduttivo o spiegazioni esterne al JSON.'
    });
    content=await doRequest(Object.assign({},requestBody,{messages:retryMessages,options:Object.assign({},requestBody.options,{temperature:0,num_predict:Math.min(requestBody.options.num_predict,1400)})}));
    parsed=aiExtractJsonObject(content);
    if(parsed) return parsed;
    throw new Error('Risposta AI non valida dopo 2 tentativi.');
  }

  async function aiPdfText(file,maxChars=aiResourceProfile().maxPdfChars,signal){
    if(!file||file.kind!=='pdf') throw new Error('Il documento principale non è un PDF.');
    aiThrowIfAborted(signal);
    if(!window.pdfjsLib&&typeof ensurePdfJs==='function') await ensurePdfJs();
    aiThrowIfAborted(signal);
    if(!window.pdfjsLib) throw new Error('PDF.js non disponibile per leggere il PDF.');
    const fileObj=await file.handle.getFile();
    let buf=await fileObj.arrayBuffer();
    aiThrowIfAborted(signal);
    const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    const chunks=[]; let total=0;
    try{
      for(let p=1;p<=pdf.numPages;p++){
        aiThrowIfAborted(signal);
        const page=await pdf.getPage(p);
        try{
          const tc=await page.getTextContent();
          const text=tc.items.map(it=>it&&it.str?it.str:'').join(' ').replace(/\s+/g,' ').trim();
          if(text) chunks.push(`\n\n--- PAGINA ${p} ---\n${text}`);
          total+=text.length;
        }finally{
          try{ if(page.cleanup) page.cleanup(); }catch(e){}
        }
        if(p % 3 === 0){ await aiIdleYield(); }
        if(total>=maxChars) break;
      }
      aiThrowIfAborted(signal);
      return {pages:pdf.numPages,text:chunks.join('').slice(0,maxChars)};
    }finally{
      try{ if(pdf.cleanup) await pdf.cleanup(); }catch(e){}
      try{ if(pdf.destroy) await pdf.destroy(); }catch(e){}
      buf=null;
    }
  }

  function aiCleanMarkdown(md){ return aiSafeText(md).replace(/^```markdown\s*/i,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim(); }

  const AI_LANGUAGE_MARKERS = {
    it:[' il ',' la ',' e ',' di ',' che ',' per ',' una ',' un ',' del ',' della ',' con ',' sono ',' come ',' questo ',' questa ',' anche ',' quindi ',' gli ',' le '],
    en:[' the ',' and ',' of ',' to ',' in ',' is ',' a ',' an ',' for ',' with ',' are ',' this ',' that ',' also ',' therefore ',' from ',' into '],
    es:[' el ',' la ',' y ',' de ',' que ',' para ',' una ',' un ',' del ',' con ',' son ',' como ',' este ',' esta ',' también ',' por lo tanto ',' los ',' las '],
    fr:[' le ',' la ',' et ',' de ',' que ',' pour ',' une ',' un ',' du ',' avec ',' sont ',' comme ',' cette ',' aussi ',' donc ',' les ',' des '],
    de:[' der ',' die ',' und ',' von ',' zu ',' in ',' ist ',' ein ',' eine ',' für ',' mit ',' sind ',' wie ',' diese ',' auch ',' daher ',' den ',' das ']
  };

  function aiLanguageLooksCorrect(text, langKey){
    const normalized=' '+aiSafeText(text).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ')+' ';
    if(normalized.trim().length<40) return true;
    const markers=AI_LANGUAGE_MARKERS[langKey]||[];
    const hits=markers.reduce((n,m)=>n+(normalized.includes(m)?1:0),0);
    return hits >= (normalized.length > 1200 ? 4 : normalized.length > 500 ? 3 : 2);
  }

  async function aiLocalizeSummaryIfNeeded(lesson,out,signal,languageKey){
    const langKey=languageKey||aiSummaryLanguage();
    const lang=AI_SUMMARY_LANGUAGES[langKey]||AI_SUMMARY_LANGUAGES.it;
    const currentSummary=aiCleanMarkdown(out&&out.summary);
    const currentTitle=aiSafeText(out&&out.title);
    if(!currentSummary) return {title:currentTitle,summary:currentSummary};
    if(aiLanguageLooksCorrect(currentSummary+' '+currentTitle,langKey)) return {title:currentTitle,summary:currentSummary};

    aiThrowIfAborted(signal);
    AIBackgroundInspector.push('summary','Controllo lingua del riepilogo',`Il testo non rispetta completamente ${lang.label}. Lo uniformo senza cambiare le informazioni.`);
    const localized=await aiOllamaJson([
      {role:'system',content:`Riscrivi fedelmente il titolo e il riepilogo forniti, senza aggiungere o togliere informazioni. LINGUA OBBLIGATORIA: ${lang.instruction}. Ogni parola generata deve essere esclusivamente in ${lang.instruction}, salvo nomi propri e terminologia tecnica indispensabile già presente. Mantieni il Markdown completo e valido: #, ##, ###, **grassetto**, *corsivo*, ==evidenziato==, elenchi, tabelle Markdown, formule inline $...$, formule su blocco $$...$$ e callout > [!KEY], > [!NOTE], > [!WARNING], > [!TIP], > [!EXAMPLE]. Non usare HTML. Restituisci SOLO JSON valido con le chiavi title e summary.`},
      {role:'user',content:`Titolo:\n${currentTitle}\n\nRiepilogo Markdown:\n${currentSummary}`}
    ],signal,{type:'object',properties:{title:{type:'string'},summary:{type:'string'}},required:['title','summary']});
    const fixed={title:aiSafeText(localized&&localized.title),summary:aiCleanMarkdown(localized&&localized.summary)};
    if(!fixed.summary) throw new Error(`Il riepilogo non è stato restituito nella lingua ${lang.label}.`);
    if(!aiLanguageLooksCorrect(fixed.summary+' '+fixed.title,langKey)) throw new Error(`Il riepilogo continua a non rispettare la lingua ${lang.label}.`);
    return fixed;
  }

  async function aiSummarize(lesson,pdfData,signal,languageKey){
    aiThrowIfAborted(signal);
    const profile = aiResourceProfile();
    const langKey = languageKey || langKey;
    const lang = AI_SUMMARY_LANGUAGES[langKey] || AI_SUMMARY_LANGUAGES.it;
    const baseInstruction=`Sei un tutor universitario professionale. Devi creare un riassunto fedele e strutturato di una lezione universitaria.

LINGUA OBBLIGATORIA E VINCOLANTE: ${lang.instruction}.
NON cambiare lingua. NON alternare lingue. NON usare inglese per intestazioni, formule spiegate a parole, callout o conclusioni. Tutto il contenuto testuale generato deve essere ESCLUSIVAMENTE in ${lang.instruction}, inclusi titolo, intestazioni, testo, elenchi, callout ed etichette. Sono ammessi solo nomi propri e terminologia tecnica indispensabile già presente nel PDF.

Usa ESCLUSIVAMENTE il contenuto del PDF fornito. Non inventare esempi, definizioni, formule o concetti assenti.

Restituisci SOLO JSON valido:
{
  "title": "titolo breve e preciso della lezione nella lingua richiesta",
  "summary": "documento Markdown completo nella lingua richiesta"
}

Formato Markdown richiesto:
- un titolo H1;
- una sezione iniziale "Sintesi" o equivalente;
- sezioni H2 per gli argomenti principali;
- usa **grassetto** per definizioni e concetti da ricordare;
- usa *corsivo* per precisazioni;
- usa \`codice inline\` per termini tecnici;
- usa \`==testo evidenziato==\` per 1-3 elementi essenziali;
- usa elenchi e tabelle quando utili;
- usa callout \`> [!KEY] testo\`, \`> [!NOTE] testo\`, \`> [!WARNING] testo\`, \`> [!TIP] testo\`, \`> [!EXAMPLE] testo\`;
- termina con una sezione "Concetti chiave" o equivalente.
Non inserire HTML.`;
    if(pdfData.text.length<=60000){
      return await aiOllamaJson(
        [{role:'system',content:baseInstruction},{role:'user',content:`Materia: ${lesson.subjectName}\nTitolo attuale: ${lesson.title||'(vuoto)'}\n\nTESTO DEL PDF:\n${pdfData.text}`}],
        signal,
        {type:'object',properties:{title:{type:'string'},summary:{type:'string'}},required:['title','summary']}
      );
    }
    const partials=[];
    for(let start=0,idx=1;start<pdfData.text.length;start+=profile.chunkChars,idx++){
      aiThrowIfAborted(signal);
      const chunk=pdfData.text.slice(start,start+AI_CHUNK_SIZE);
      const out=await aiOllamaJson(
        [{role:'system',content:`Riassumi fedelmente questo segmento di una lezione universitaria esclusivamente in ${lang.instruction}. Rispondi SOLO JSON {"summary":"..."}. Usa Markdown leggibile con **grassetto**, *corsivo*, \`==evidenziato==\` e callout quando utili. Non inventare nulla.`},
         {role:'user',content:`Segmento ${idx}\nMateria: ${lesson.subjectName}\n${chunk}`}],
        signal,
        {type:'object',properties:{summary:{type:'string'}},required:['summary']}
      );
      if(out&&out.summary) partials.push(aiCleanMarkdown(out.summary).slice(0,7000));
      await aiYield(profile.betweenRequests);
    }
    aiThrowIfAborted(signal);
    return await aiOllamaJson(
      [{role:'system',content:baseInstruction},{role:'user',content:`Materia: ${lesson.subjectName}\nTitolo attuale: ${lesson.title||'(vuoto)'}\n\nRIASSUNTI DEI SEGMENTI:\n${partials.join('\n\n---\n\n')}`}],
      signal,
      {type:'object',properties:{title:{type:'string'},summary:{type:'string'}},required:['title','summary']}
    );
  }

  async function aiProcessLesson(lesson,index,total,signal){
    let meta=await aiReadMeta(lesson);
    let doneState=meta.aiAutomation||lesson.aiAutomation;
    const summaryHandle=await aiGetSummaryFile(lesson,{create:false,migrateLegacy:true});
    const summaryExists=!!summaryHandle;
    const summaryValid=await aiSummaryIsValid(lesson,summaryHandle);
    if(doneState&&doneState.done===true && summaryValid) return {done:true,skipped:true};

    if(!lesson.mainFile||lesson.mainFile.kind!=='pdf'){
      await aiPersist(lesson,{aiAutomation:Object.assign({},doneState||{},{
        version:AI_AUTOMATION_VERSION,status:'waiting-main-pdf',processing:false,done:false,
        lastError:'Documento principale PDF non disponibile.'
      })});
      return {done:false,waiting:true};
    }

    aiThrowIfAborted(signal);
    const summaryLanguage = aiSummaryLanguage();
    const summaryLanguageInfo = AI_SUMMARY_LANGUAGES[summaryLanguage] || AI_SUMMARY_LANGUAGES.it;
    lesson.aiAutomation=Object.assign({},doneState||{},{
      version:AI_AUTOMATION_VERSION,processing:true,status:'processing',model:aiModel(),
      startedAt:Date.now(),lastError:null,analysisScope:'main-pdf-only',audioMode:'untouched',resourceProfile:localStorage.getItem('uninotes.aiBackgroundLowPower') !== '0' ? 'eco' : 'normal', language:summaryLanguage
    });
    await aiPersist(lesson,{aiAutomation:lesson.aiAutomation});

    aiStatus({
      phase:'processing',
      currentLesson:`${lesson.subjectName} · Lezione ${lesson.number??''}`,
      currentSubject:lesson.subjectName,
      completed:index,total
    });
    AIBackgroundInspector.push('start',
      `Inizio elaborazione: ${lesson.subjectName} · Lezione ${lesson.number??''}`,
      'Verrà analizzato esclusivamente il PDF principale. Gli altri file resteranno invariati.'
    );

    let pdfData;
    try{
      AIBackgroundInspector.push('pdf', `Leggo il PDF principale: ${lesson.mainFile.name}`, 'Estraggo il testo pagina per pagina.');
      pdfData=await aiPdfText(lesson.mainFile,AI_MAX_FULL_PDF_TEXT,signal);
      aiThrowIfAborted(signal);
      lesson.mainFilePages=pdfData.pages;
      AIBackgroundInspector.push('pdf', `PDF letto: ${pdfData.pages} pagine`, 'Il contenuto è pronto per la generazione del riepilogo.');

      const metaNow=await aiReadMeta(lesson);
      metaNow.mainFilePages=pdfData.pages;
      metaNow.mainFilePagesFor=lesson.mainFile.name;
      await FileSystemManager.writeTextFile(
        await FileSystemManager.getOrCreateFile(lesson.handle,'.lesson.json'),
        JSON.stringify(metaNow,null,2)
      );
    }catch(err){
      if(err&&err.name==='AbortError') throw err;
      await aiPersist(lesson,{aiAutomation:{processing:false,status:'error',done:false,lastError:'Lettura PDF fallita: '+(err.message||err)}});
      throw err;
    }

    aiThrowIfAborted(signal);
    AIBackgroundInspector.push('summary', 'Creo Riepilogo AI.md', `Lingua: ${summaryLanguageInfo.label}. Il riepilogo sarà basato esclusivamente sul PDF.`);
    let summaryOut=await aiSummarize(lesson,pdfData,signal,summaryLanguage);
    summaryOut=await aiLocalizeSummaryIfNeeded(lesson,summaryOut,signal,summaryLanguage);
    aiThrowIfAborted(signal);
    const summary=aiCleanMarkdown(summaryOut&&summaryOut.summary);
    const newTitle=requiredLessonTitle(aiSafeText(summaryOut&&summaryOut.title));
    if(!summary) throw new Error('L’AI non ha restituito un riassunto valido.');

    await aiCreateSummaryFile(lesson,summary,signal);
    AIBackgroundInspector.push('summary','Riepilogo AI.md salvato','Il file è stato creato nella cartella della lezione.');

    aiThrowIfAborted(signal);
    const title=newTitle||lesson.title||`Lezione ${lesson.number??''}`;
    await aiPersist(lesson,{title,aiSummaryFileName:AI_SUMMARY_FILE_NAME});
    AIBackgroundInspector.push('title',`Titolo aggiornato: ${title}`,'Titolo ricavato esclusivamente dal contenuto del PDF.');

    aiThrowIfAborted(signal);
    lesson.aiAutomation=Object.assign({},lesson.aiAutomation,{
      version:AI_AUTOMATION_VERSION,processing:false,done:true,status:'done',
      completedAt:Date.now(),model:aiModel(),summaryFileName:AI_SUMMARY_FILE_NAME,summaryFolder:AI_SUMMARY_FOLDER_NAME,language:summaryLanguage,
      analysisScope:'main-pdf-only',audioMode:'untouched',resourceProfile:localStorage.getItem('uninotes.aiBackgroundLowPower') !== '0' ? 'eco' : 'normal'
    });
    await aiPersist(lesson,{aiAutomation:lesson.aiAutomation});
    AIBackgroundInspector.push('done',
      `Elaborazione completata: ${lesson.subjectName} · Lezione ${lesson.number??''}`,
      'Il riepilogo è stato salvato in Riepiloghi AI/. Da ora questa lezione non verrà più elaborata finché il riepilogo resta valido.'
    );
    await aiRefreshLessonView(lesson);
    return {done:true};
  }


  const AIBackgroundWorker={
    running:false,timer:null,controller:null,stopped:false,resumeRequested:false,currentLesson:null,
    connectionCache:null,
    schedule(ms=7000){
      clearTimeout(this.timer);
      this.timer=setTimeout(()=>this.tick().catch(()=>{}),ms);
    },
    async getConnection(){
      const now=Date.now();
      if(this.connectionCache && now-this.connectionCache.at<30000) return this.connectionCache.value;
      const value=await OllamaManager.testConnection();
      this.connectionCache={at:now,value};
      return value;
    },
    async tick(){
      if(this.running||this.stopped||!aiEnabled()){
        this.schedule(aiEnabled()?20000:30000);
        return;
      }
      if(!AppState||!AppState.dirHandle){
        this.schedule(5000);
        return;
      }
      // Non competere con le altre operazioni CPU/PDF dell'app.
      if(window.UniNotesPageCountBusy || window.UniNotesPdfIndexBusy || (typeof ContentIndex!=='undefined'&&ContentIndex.building) || (typeof PdfIndex!=='undefined'&&PdfIndex.building)){
        aiStatus({phase:'paused',currentLesson:null});
        this.schedule(10000);
        return;
      }
      // L'uso normale dell'app non blocca il worker AI: viene eseguito in background.

      const connection=await this.getConnection();
      if(!connection.ok){
        aiStatus({phase:'idle'});
        this.schedule(60000);
        return;
      }
      if(!OllamaManager.getModel()&&connection.models&&connection.models[0]) OllamaManager.setModel(connection.models[0]);
      if(!OllamaManager.getModel()){
        this.schedule(60000);
        return;
      }

      this.running=true;
      this.stopped=false;
      this.resumeRequested=false;
      this.controller=new AbortController();
      let lessons=[];
      let completed=0;

      try{
        lessons=allLessonsFlat();
        const pending=[];
        for(const lesson of lessons){
          if(this.controller.signal.aborted) throw aiAbortError();
          const meta=await aiReadMeta(lesson);
          const summaryHandle=await aiGetSummaryFile(lesson,{create:false,migrateLegacy:true});
          const summaryValid=await aiSummaryIsValid(lesson,summaryHandle);
          if(meta.aiAutomation&&meta.aiAutomation.done===true&&summaryValid) completed++;
          else pending.push(lesson);
        }

        if(!pending.length){
          aiStatus({phase:'idle',completed,total:lessons.length});
          this.schedule(120000);
          return;
        }

        // Una sola lezione per ciclo: evita sessioni CPU continue e rende il browser reattivo.
        if(pending.length && !this.stopped && this.controller && !this.controller.signal.aborted){
          const lesson=pending[0];
          this.currentLesson=lesson;
          try{
            await aiIdleYield();
            const result=await aiProcessLesson(lesson,completed,lessons.length,this.controller.signal);
            if(result&&result.done) completed++;
          }catch(err){
            if(err&&err.name==='AbortError'){
              this.stopped=true;
              if(this.currentLesson){
                try{
                  await aiPersist(this.currentLesson,{aiAutomation:{
                    processing:false,status:'stopped',done:false,
                    stoppedAt:Date.now(),lastError:null,
                    analysisScope:'main-pdf-only',audioMode:'untouched',resourceProfile:localStorage.getItem('uninotes.aiBackgroundLowPower') !== '0' ? 'eco' : 'normal'
                  }});
                }catch(e){}
              }
            }else{
              console.warn('[Uni Notes AI] elaborazione lezione fallita:',lesson.subjectName,lesson.number,err);
              AIBackgroundInspector.push('error',
                `Elaborazione fallita: ${lesson.subjectName} · Lezione ${lesson.number??''}`,
                err.message||String(err)
              );
              aiStatus({phase:'error',error:err.message||String(err),completed,total:lessons.length});
            }
          }
          this.currentLesson=null;
        }

        if(this.stopped){
          aiStatus({
            phase:'stopped',
            currentLesson:window.UniNotesAIBackgroundStatus&&window.UniNotesAIBackgroundStatus.currentLesson||null,
            completed,total:lessons.length
          });
          AIBackgroundInspector.push('wait','Elaborazione interrotta','La lezione corrente non è stata marcata come completata. Premi “Riprendi” per continuare.');
        }else{
          aiStatus({phase:'idle',completed,total:lessons.length});
        }

        const profile=aiResourceProfile();
        this.schedule(this.stopped?300000:(pending.length?profile.betweenLessons:120000));
      }finally{
        this.currentLesson=null;
        this.running=false;
        this.controller=null;
        AIBackgroundInspector.render();
      }
    },
    start(immediate=false){
      this.stopped=false;
      this.resumeRequested=true;
      aiEnsureIndicator();
      clearTimeout(this.timer);
      this.schedule(immediate?200:2500);
    },
    stop(){
      this.stopped=true;
      const current=this.currentLesson;
      if(this.controller) this.controller.abort();
      clearTimeout(this.timer);
      const currentName=(window.UniNotesAIBackgroundStatus||{}).currentLesson||null;
      aiStatus({phase:'stopped',currentLesson:currentName});
      if(current){
        aiPersist(current,{aiAutomation:{
          processing:false,status:'stopped',done:false,
          stoppedAt:Date.now(),lastError:null,
          analysisScope:'main-pdf-only',audioMode:'untouched',resourceProfile:localStorage.getItem('uninotes.aiBackgroundLowPower') !== '0' ? 'eco' : 'normal'
        }}).catch(()=>{});
      }
      AIBackgroundInspector.push('wait','Richiesta di stop ricevuta','Interrompo l’operazione in corso senza segnare la lezione come completata. Puoi riprendere in seguito.');
      AIBackgroundInspector.render();
    },
    enabled:aiEnabled
  };

  window.UniNotesAIBackground=AIBackgroundWorker;
  window.UniNotesAISummaryFile=AI_SUMMARY_FILE_NAME;
  window.UniNotesAISummaryFolder=AI_SUMMARY_FOLDER_NAME;

  if(typeof LibraryScanner!=='undefined'&&!LibraryScanner.__aiBackgroundPatched){
    const origScanLesson=LibraryScanner.scanLesson.bind(LibraryScanner);
    LibraryScanner.scanLesson=async function(...args){
      const lesson=await origScanLesson(...args);
      try{
        const lessonHandle=args[1]; let meta={};
        try{ const mh=await lessonHandle.getFileHandle('.lesson.json'); meta=JSON.parse(await FileSystemManager.readTextFile(mh)); }catch(e){}
        lesson.aiAutomation=meta.aiAutomation||null;
        lesson.aiSummaryFileName=meta.aiSummaryFileName||AI_SUMMARY_FILE_NAME;

        // Sposta/recupera il riepilogo nella sottocartella dedicata e poi nascondi
        // completamente quella cartella dal materiale della lezione.
        const summaryHandle=await aiGetSummaryFile(lesson,{create:false,migrateLegacy:true});
        if(summaryHandle){
          lesson.aiSummaryFile={name:AI_SUMMARY_FILE_NAME,handle:summaryHandle,kind:'text',folder:AI_SUMMARY_FOLDER_NAME};
        }

        // Compatibilità con le versioni precedenti: se il vecchio riepilogo era
        // stato erroneamente scelto come documento principale, ristabiliamo il PDF.
        if(lesson.mainFile && lesson.mainFile.name===AI_SUMMARY_FILE_NAME){
          try{
            const rootEntries=await FileSystemManager.listEntries(lessonHandle);
            const pdfCandidates=rootEntries.filter(e=>e.kind==='file' && e.name!==AI_SUMMARY_FILE_NAME && extOf(e.name)==='pdf')
              .sort((a,b)=>{
                const ah=MAIN_FILE_NAME_HINTS.some(h=>a.name.toLowerCase().includes(h)) ? 0 : 1;
                const bh=MAIN_FILE_NAME_HINTS.some(h=>b.name.toLowerCase().includes(h)) ? 0 : 1;
                return ah-bh || a.name.localeCompare(b.name,'it',{numeric:true});
              });
            if(pdfCandidates.length){
              lesson.mainFile={name:pdfCandidates[0].name,handle:pdfCandidates[0].handle,kind:'pdf',folder:null};
              await aiPersist(lesson,{mainFile:pdfCandidates[0].name});
            }else lesson.mainFile=null;
          }catch(e){ lesson.mainFile=null; }
        }

        lesson.otherRootFiles=(lesson.otherRootFiles||[]).filter(f=>f.name!==AI_SUMMARY_FILE_NAME);
        Object.keys(lesson.files||{}).forEach(k=>{
          lesson.files[k]=(lesson.files[k]||[]).filter(f=>f.name!==AI_SUMMARY_FILE_NAME && f.folder!==AI_SUMMARY_FOLDER_NAME);
        });
        lesson.subfolders=(lesson.subfolders||[]).filter(sf=>String(sf.name).toLowerCase()!==AI_SUMMARY_FOLDER_NAME.toLowerCase());
      }catch(e){ console.warn('[Uni Notes AI] preparazione riepilogo fallita:',e); }
      return lesson;
    };
    LibraryScanner.__aiBackgroundPatched=true;
  }

  if(typeof LessonPage!=='undefined'&&!LessonPage.__aiBackgroundPatched){
    const origRenderMainDoc=LessonPage.renderMainDoc.bind(LessonPage);
    LessonPage.renderMainDoc=async function(lesson){
      const summaryFile=lesson&&lesson.aiSummaryFile; if(summaryFile){
        const el=document.getElementById('lesson-main-doc'); if(!el) return; let markdown=''; try{markdown=await FileSystemManager.readTextFile(summaryFile.handle);}catch(e){}
        if(markdown){
          let mainMeta={}; try{mainMeta=await FileSystemManager.getFileMeta(lesson.mainFile);}catch(e){}
          el.innerHTML=`<div class="card ai-summary-shell"><div class="ai-summary-head"><div class="ai-summary-brand"><span class="ai-summary-icon">${icon('ai',16)}</span><div><div class="ai-summary-title">Riepilogo intelligente</div><div class="ai-summary-sub">Generato localmente con Ollama · lingua: ${esc(aiSummaryLanguageInfo().label)} · fonte: ${esc(lesson.mainFile?lesson.mainFile.name:'PDF principale')}</div></div></div><div class="ai-summary-actions">${lesson.mainFile?`<button class="btn btn-sm" id="ai-summary-open-pdf">${icon('pdf',13)} Apri PDF</button>`:''}<button class="btn btn-sm" id="ai-summary-open-md">${icon('file',13)} Apri Markdown</button></div></div><div class="ai-summary-content" id="ai-summary-markdown"></div></div>`;
          const markdownHost=el.querySelector('#ai-summary-markdown'); if(markdownHost) MarkdownPreview.renderAsync(markdown,markdownHost);
          const openPdf=el.querySelector('#ai-summary-open-pdf'); if(openPdf&&lesson.mainFile) openPdf.addEventListener('click',()=>PDFViewerModal.open(lesson,lesson.mainFile));
          const openMd=el.querySelector('#ai-summary-open-md'); if(openMd) openMd.addEventListener('click',()=>FileViewer.open(lesson,summaryFile)); return;
        }
      }
      return origRenderMainDoc(lesson);
    };
    LessonPage.__aiBackgroundPatched=true;
  }

  const style=document.createElement('style'); style.textContent=`
    .ai-summary-shell{padding:0;overflow:hidden;}
    .ai-summary-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--surface-2));}
    .ai-summary-brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .ai-summary-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
    .ai-summary-title{font-size:14px;font-weight:750;letter-spacing:-.01em;}
    .ai-summary-sub{font-size:11px;color:var(--text-tertiary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;}
    .ai-summary-actions{display:flex;gap:7px;flex-shrink:0;}
    .ai-summary-content{padding:28px 34px;max-width:920px;margin:0 auto;font-size:14px;line-height:1.72;}
    .ai-summary-content h1,.ai-summary-content h2,.ai-summary-content h3{letter-spacing:-.02em;}
    .ai-summary-content strong{font-weight:800;color:var(--text);}
    .ai-summary-content em{color:var(--text-secondary);}
    .ai-summary-content .md-mark{display:inline;padding:0 .2em;border-radius:.32em;background:linear-gradient(180deg,transparent 28%,rgba(255,221,87,.58) 28%,rgba(255,221,87,.58) 88%,transparent 88%);}
    .ai-summary-content .md-callout{margin:14px 0;padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface-2);box-shadow:var(--shadow-sm);}
    .ai-summary-content .md-callout-label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;color:var(--accent);}
    .ai-summary-content .md-callout-text{font-size:13.5px;line-height:1.6;}
    .ai-summary-content .md-callout-key{border-left-color:var(--accent);background:var(--accent-soft);}
    .ai-summary-content .md-callout-key .md-callout-label{color:var(--accent);}
    .ai-summary-content .md-callout-note{border-left-color:var(--success);background:var(--success-soft);}
    .ai-summary-content .md-callout-note .md-callout-label{color:var(--success);}
    .ai-summary-content .md-callout-warning{border-left-color:var(--warning);background:var(--warning-soft);}
    .ai-summary-content .md-callout-warning .md-callout-label{color:var(--warning);}
    .ai-summary-content .md-callout-tip{border-left-color:var(--accent-strong);background:var(--accent-soft);}
    .ai-summary-content .md-callout-tip .md-callout-label{color:var(--accent-strong);}
    .ai-summary-content .md-callout-example{border-left-color:#8b5cf6;background:rgba(139,92,246,.08);}
    .ai-summary-content .md-callout-example .md-callout-label{color:#7c3aed;}
    .ai-summary-content .md-table-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:12px;}
    .ai-summary-content .md-table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px;}
    .ai-summary-content .md-table th,.ai-summary-content .md-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
    .ai-summary-content .md-table th{background:var(--surface-2);font-weight:800;color:var(--text);}
    .ai-summary-content .md-table tr:last-child td{border-bottom:none;}
    .ai-summary-content .md-code{margin:14px 0;padding:14px 16px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;line-height:1.65;}
    .ai-summary-content .md-math{display:inline-flex;align-items:center;justify-content:center;margin:0 2px;}
    .ai-summary-content .md-math-block{display:flex;width:100%;margin:18px 0;padding:14px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow-x:auto;}
    .ai-summary-content .md-math-fallback{font-family:var(--mono);font-size:13px;color:var(--text-secondary);}
    @media(max-width:720px){.ai-summary-head{align-items:flex-start;flex-direction:column;}.ai-summary-actions{width:100%;}.ai-summary-actions .btn{flex:1;justify-content:center;}.ai-summary-content{padding:20px 18px;font-size:14px;}.ai-summary-sub{max-width:82vw;}}
  `; document.head.appendChild(style);

  if(typeof SettingsPage!=='undefined'&&!SettingsPage.__aiBackgroundSettingsPatched){
    const origSettings=SettingsPage.render.bind(SettingsPage);
    SettingsPage.render=function(){
      origSettings(); const card=document.getElementById('ai-settings-card'); if(!card||card.querySelector('#ai-bg-enable')) return;
      const wrap=document.createElement('div'); wrap.style.cssText='margin-top:14px;padding-top:14px;border-top:1px solid var(--border);';
      wrap.innerHTML=`<label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;"><input type="checkbox" id="ai-bg-enable" style="margin-top:2px;width:15px;height:15px;"><span><b>Automazione AI in background</b><br><span class="muted">Quando Ollama è disponibile, Uni Notes analizza automaticamente esclusivamente il PDF principale e genera il riepilogo AI. Gli altri file non vengono modificati.</span></span></label><label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;margin-top:12px;"><input type="checkbox" id="ai-bg-lowpower" style="margin-top:2px;width:15px;height:15px;"><span><b>Modalità risparmio risorse</b><br><span class="muted">Riduce memoria e carico del modello: una sola lezione per ciclo, contesto più contenuto, pause tra le richieste e rilascio del modello dopo l'inattività.</span></span></label><div id="ai-bg-settings-status" class="muted" style="font-size:11.5px;margin-top:8px;"></div>`;
      card.appendChild(wrap); const cb=wrap.querySelector('#ai-bg-enable'); const lp=wrap.querySelector('#ai-bg-lowpower'); cb.checked=aiEnabled(); lp.checked=localStorage.getItem('uninotes.aiBackgroundLowPower') !== '0'; cb.addEventListener('change',()=>{localStorage.setItem('uninotes.aiBackgroundEnabled',cb.checked?'1':'0');if(cb.checked)AIBackgroundWorker.start();else AIBackgroundWorker.stop();wrap.querySelector('#ai-bg-settings-status').textContent=cb.checked?'Automazione attiva.':'Automazione disattivata.';}); lp.addEventListener('change',()=>{localStorage.setItem('uninotes.aiBackgroundLowPower',lp.checked?'1':'0');AIBackgroundInspector.push('wait',lp.checked?'Modalità risparmio risorse attivata':'Modalità prestazioni AI attivata','La modifica sarà applicata alla prossima richiesta Ollama.');}); wrap.querySelector('#ai-bg-settings-status').textContent=cb.checked?(lp.checked?'Automazione attiva · risparmio risorse.':'Automazione attiva · prestazioni.'):'Automazione disattivata.';
    }; SettingsPage.__aiBackgroundSettingsPatched=true;
  }

  aiEnsureIndicator();
  setTimeout(()=>AIBackgroundWorker.start(),1200);
  console.info('[Uni Notes AI] Automazione background pronta: coda seriale, una lezione per ciclo, risparmio risorse predefinito, PDF analizzato senza concorrenza e modello rilasciato dopo inattività.');
})();
</script>
