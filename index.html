      Toast.success(`Impostazioni stampa salvate: ${fmtMoney(facePrice)} per facciata · ${duplex ? 'fronte-retro' : 'solo fronte'}.`);
    });
    content.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => { AppState.setTheme(b.dataset.theme); this.render(); }));
    content.querySelector('#set-install-pwa').addEventListener('click', () => {
      if(window.deferredPwaPrompt){
        window.deferredPwaPrompt.prompt();
      } else {
        Toast.info('Su questo browser installa l\'app dal menu del browser o tramite "Condividi → Aggiungi a Home".');
      }
    });
  }
};

/* ============================================================
   EXPORT / DOWNLOAD CENTER — esportazione granulare in ZIP
   ------------------------------------------------------------
   Tutto avviene localmente nel browser. La funzione legge i file
   già presenti nella cartella collegata, senza modificarli.
   ============================================================ */
const ExportPage = {
  state: {
    ready: false,
    records: [],
    subjectOpen: {},
    selectedLessons: new Set(),
    selectedExts: new Set(),
    excludedFiles: new Set(),
    includeAi: false,
    includeSystem: false,
    customExts: '',
    structure: 'subject-lesson',
    filename: ''
  },

  defaultFilename(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    return `Uni Notes — Export ${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  },

  resetSelections(){
    this.state.selectedLessons = new Set(this.state.records.filter(r => r.lessonId).map(r => r.lessonId));
    this.state.selectedExts = new Set([...new Set(this.state.records.filter(r => !r.isSystem && !r.isAi).map(r => r.ext || '(nessuna estensione)'))]);
    this.state.excludedFiles = new Set();
    this.state.includeAi = false;
    this.state.includeSystem = false;
    this.state.customExts = '';
    this.state.structure = 'subject-lesson';
    this.state.filename = this.defaultFilename();
  },

  async buildIndex(){
    if(!AppState.dirHandle || !AppState.library?.subjects?.length){
      this.state.records = [];
      this.state.ready = true;
      return;
    }
    const records = [];
    const walk = async (dirHandle, parts, subject, lessonId) => {
      for await (const [name, handle] of dirHandle.entries()){
        const nextParts = [...parts, name];
        if(handle.kind === 'directory'){
          await walk(handle, nextParts, subject, lessonId || subject.lessons.find(l => l.folderName === name)?.id || null);
          continue;
        }
        const ext = extOf(name);
        const hidden = name.startsWith('.');
        const path = nextParts.join('/');
        const lessonPart = nextParts.findIndex(x => subject.lessons.some(l => l.folderName === x));
        let resolvedLessonId = lessonId;
        if(!resolvedLessonId && lessonPart >= 0){
          const folder = nextParts[lessonPart];
          resolvedLessonId = subject.lessons.find(l => l.folderName === folder)?.id || null;
        }
        const lesson = resolvedLessonId ? subject.lessons.find(l=>l.id===resolvedLessonId) : null;
        const isAi = nextParts.includes('Riepiloghi AI') && name.toLowerCase() === 'riepilogo ai.md';
        const isSystem = hidden || nextParts.includes('config');
        let size = null, modified = null, mime = '';
        try{
          const file = await handle.getFile();
          size = file.size; modified = file.lastModified; mime = file.type || '';
        }catch(e){}
        records.push({
          id: uid(), name, handle, subjectName: subject.name, subjectId: subject.id,
          lessonId: resolvedLessonId, lessonFolder: lesson?.folderName || null,
          lessonTitle: lesson ? (lesson.title || `Lezione ${lesson.number ?? ''}`) : null,
          relPath: path, ext, size, modified, mime, hidden, isSystem, isAi
        });
      }
    };
    for(const subject of AppState.library.subjects){
      this.state.subjectOpen[subject.id] = this.state.subjectOpen[subject.id] !== false;
      await walk(subject.handle, [], subject, null);
    }
    this.state.records = records.sort((a,b)=>a.relPath.localeCompare(b.relPath,'it',{numeric:true}));
    this.resetSelections();
    this.state.ready = true;
  },

  extensionLabel(ext){
    if(ext === '(nessuna estensione)') return 'Senza estensione';
    return '.' + ext.toUpperCase();
  },

  extensionGroup(ext){
    if(['pdf'].includes(ext)) return 'PDF';
    if(['mp3','m4a','wav','aac','ogg','flac','opus'].includes(ext)) return 'Audio';
    if(['png','jpg','jpeg','webp','gif','svg','heic','avif'].includes(ext)) return 'Immagini';
    if(['doc','docx','txt','md','rtf','odt'].includes(ext)) return 'Documenti';
    if(['tex','bib','css','html','js','ts','py','java','c','cpp','h','hpp','json','xml','yml','yaml'].includes(ext)) return 'Testo / codice';
    if(['csv','xls','xlsx','ods'].includes(ext)) return 'Fogli di calcolo';
    if(['ppt','pptx','odp'].includes(ext)) return 'Presentazioni';
    if(['zip','rar','7z','tar','gz'].includes(ext)) return 'Archivi';
    if(['mp4','mov','mkv','webm','avi'].includes(ext)) return 'Video';
    return 'Altro';
  },

  allExtensions(){
    const set = new Set(this.state.records.filter(r=>!r.isSystem && !r.isAi).map(r=>r.ext || '(nessuna estensione)'));
    return [...set].sort((a,b)=>a.localeCompare(b,'it'));
  },

  parseCustomExtensions(){
    return this.state.customExts.split(/[;,\s]+/).map(x=>x.trim().toLowerCase().replace(/^\./,'')).filter(Boolean);
  },

  isExtensionSelected(ext){
    const customs = this.parseCustomExtensions();
    return this.state.selectedExts.has(ext) || (ext && customs.includes(ext));
  },

  selectedRecords(){
    const lessonSet = this.state.selectedLessons;
    return this.state.records.filter(r => {
      // I file speciali hanno controlli dedicati e non vengono bloccati dal filtro estensioni.
      if(r.isAi) return !!this.state.includeAi && !!r.lessonId && lessonSet.has(r.lessonId);
      if(r.isSystem) return !!this.state.includeSystem && !!r.lessonId && lessonSet.has(r.lessonId);
      // L'export è pensato per materiale delle lezioni: i file tecnici fuori dalle lezioni
      // vengono esportati solo quando si abilita esplicitamente l'opzione tecnica.
      if(!r.lessonId) return false;
      if(!lessonSet.has(r.lessonId)) return false;
      if(this.state.excludedFiles.has(r.id)) return false;
      return this.isExtensionSelected(r.ext || '(nessuna estensione)');
    });
  },

  selectionSize(){ return this.selectedRecords().reduce((n,r)=>n+(Number(r.size)||0),0); },

  setAllLessons(selected){
    this.state.selectedLessons = new Set(selected ? this.state.records.filter(r=>r.lessonId).map(r=>r.lessonId) : []);
    this.renderBody();
  },

  setSubjectLessons(subjectId, selected){
    const subject = AppState.library.subjects.find(s=>s.id===subjectId);
    if(!subject) return;
    subject.lessons.forEach(l => selected ? this.state.selectedLessons.add(l.id) : this.state.selectedLessons.delete(l.id));
    this.renderBody();
  },

  setPreset(kind){
    const exts = this.allExtensions();
    this.state.customExts = '';
    if(kind === 'all') this.state.selectedExts = new Set(exts);
    else if(kind === 'none') this.state.selectedExts = new Set();
    else if(kind === 'pdf') this.state.selectedExts = new Set(exts.filter(e=>e==='pdf'));
    else if(kind === 'audio') this.state.selectedExts = new Set(exts.filter(e=>['mp3','m4a','wav','aac','ogg','flac','opus'].includes(e)));
    else if(kind === 'docs') this.state.selectedExts = new Set(exts.filter(e=>['doc','docx','txt','md','rtf','odt','tex','bib','json'].includes(e)));
    else if(kind === 'images') this.state.selectedExts = new Set(exts.filter(e=>['png','jpg','jpeg','webp','gif','svg','heic','avif'].includes(e)));
    this.renderBody();
  },

  filteredCandidates(){
    const lessonSet=this.state.selectedLessons;
    return this.state.records.filter(r=>{
      if(r.isAi) return !!this.state.includeAi && !!r.lessonId && lessonSet.has(r.lessonId);
      if(r.isSystem) return !!this.state.includeSystem && !!r.lessonId && lessonSet.has(r.lessonId);
      if(!r.lessonId || !lessonSet.has(r.lessonId)) return false;
      return this.isExtensionSelected(r.ext || '(nessuna estensione)');
    });
  },

  selectedLessonSubjectIds(){
    const set = new Set();
    for(const s of AppState.library.subjects){ if(s.lessons.some(l=>this.state.selectedLessons.has(l.id))) set.add(s.id); }
    return set;
  },

  buildZipName(){
    const raw = (this.state.filename || this.defaultFilename()).trim().replace(/\.zip$/i,'');
    return (raw || this.defaultFilename()).replace(/[\\/:*?"<>|]+/g,'-').trim() + '.zip';
  },

  zipDosTime(ms){
    const d = new Date(ms || Date.now());
    return ((d.getHours()<<11) | (d.getMinutes()<<5) | Math.floor(d.getSeconds()/2)) & 0xffff;
  },
  zipDosDate(ms){
    const d = new Date(ms || Date.now());
    const y = Math.max(1980, d.getFullYear());
    return (((y-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xffff;
  },
  u16(n){ const a=new Uint8Array(2); new DataView(a.buffer).setUint16(0,n,true); return a; },
  u32(n){ const a=new Uint8Array(4); new DataView(a.buffer).setUint32(0,n>>>0,true); return a; },

  crcTable:null,
  getCrcTable(){
    if(this.crcTable) return this.crcTable;
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);
      t[n]=c>>>0;
    }
    this.crcTable=t; return t;
  },
  async crc32File(file){
    const table=this.getCrcTable(); let crc=0xffffffff;
    if(file.stream){
      const reader=file.stream().getReader();
      try{
        while(true){
          const {value,done}=await reader.read();
          if(done) break;
          const bytes=value||new Uint8Array();
          for(let i=0;i<bytes.length;i++) crc=table[(crc^bytes[i])&255]^(crc>>>8);
        }
      }finally{ try{reader.releaseLock();}catch(e){} }
    }else{
      const bytes=new Uint8Array(await file.arrayBuffer());
      for(let i=0;i<bytes.length;i++) crc=table[(crc^bytes[i])&255]^(crc>>>8);
    }
    return (crc^0xffffffff)>>>0;
  },

  zipEntryPath(record){
    const safe=(x)=>String(x||'').replace(/^[/\\]+/,'').replace(/\\/g,'/');
    if(this.state.structure==='flat') return safe(record.name);
    if(this.state.structure==='lesson'){
      return record.lessonFolder ? safe(`${record.lessonFolder}/${record.name}`) : safe(record.name);
    }
    // default: subject / lesson / path dentro la lezione; preserva anche i file fuori dalle lezioni
    return safe(`${record.subjectName}/${record.relPath}`);
  },

  async createZip(records, onProgress){
    const parts=[]; const central=[]; let offset=0;
    const usedPaths=new Map();
    for(let i=0;i<records.length;i++){
      const r=records[i];
      const file=await r.handle.getFile();
      if(file.size>0xffffffff) throw new Error(`Il file "${r.name}" supera il limite ZIP classico di 4 GB.`);
      let name=this.zipEntryPath(r);
      const originalName=name;
      let collision=(usedPaths.get(originalName)||0);
      if(collision){
        const dot=originalName.lastIndexOf('.');
        const stem=dot>originalName.lastIndexOf('/')?originalName.slice(0,dot):originalName;
        const ext=dot>originalName.lastIndexOf('/')?originalName.slice(dot):'';
        do { collision++; name=`${stem} (${collision})${ext}`; } while(usedPaths.has(name));
      }
      usedPaths.set(originalName,collision||1);
      usedPaths.set(name,1);
      const nameBytes=new TextEncoder().encode(name);
      const crc=await this.crc32File(file);
      const time=this.zipDosTime(r.modified || file.lastModified);
      const date=this.zipDosDate(r.modified || file.lastModified);
      const local=new Uint8Array(30+nameBytes.length);
      const dv=new DataView(local.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
      dv.setUint16(8,0,true); dv.setUint16(10,time,true); dv.setUint16(12,date,true);
      dv.setUint32(14,crc,true); dv.setUint32(18,file.size,true); dv.setUint32(22,file.size,true);
      dv.setUint16(26,nameBytes.length,true); dv.setUint16(28,0,true);
      local.set(nameBytes,30);
      parts.push(local,file);
      const c=new Uint8Array(46+nameBytes.length); const cv=new DataView(c.buffer);
      cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
      cv.setUint16(10,0,true); cv.setUint16(12,time,true); cv.setUint16(14,date,true);
      cv.setUint32(16,crc,true); cv.setUint32(20,file.size,true); cv.setUint32(24,file.size,true);
      cv.setUint16(28,nameBytes.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset>>>0,true);
      c.set(nameBytes,46); central.push(c);
      offset += local.length + file.size;
      if(offset > 0xffffffff) throw new Error("L'archivio supera 4 GB e il browser non può creare un ZIP classico per questa selezione. Riduci la selezione e riprova.");
      onProgress?.(i+1, records.length, r, file.size);
      await new Promise(requestAnimationFrame);
    }
    const centralOffset=offset;
    const centralSize=central.reduce((n,b)=>n+b.length,0);
    parts.push(...central);
    const end=new Uint8Array(22); const ev=new DataView(end.buffer);
    ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
    ev.setUint16(8,records.length,true); ev.setUint16(10,records.length,true); ev.setUint32(12,centralSize>>>0,true); ev.setUint32(16,centralOffset>>>0,true); ev.setUint16(20,0,true);
    parts.push(end);
    return new Blob(parts,{type:'application/zip'});
  },

  async download(){
    const records=this.selectedRecords();
    if(!records.length){ Toast.error('La selezione non contiene file. Controlla materie, lezioni e tipi di file.'); return; }
    const btn=document.getElementById('export-download-btn');
    const progress=document.getElementById('export-progress');
    const fill=document.getElementById('export-progress-fill');
    const ptxt=document.getElementById('export-progress-text');
    if(btn) btn.disabled=true;
    progress?.classList.add('show');
    if(fill) fill.style.width='0%';
    try{
      const blob=await this.createZip(records,(done,total,r,size)=>{
        const pct=Math.round(done/total*100);
        if(fill) fill.style.width=pct+'%';
        if(ptxt) ptxt.innerHTML=`<span>${done} / ${total} · ${esc(r.name)}</span><span>${fmtBytes(size)}</span>`;
      });
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=this.buildZipName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),15000);
      Toast.success(`Export completato: ${records.length} file · ${fmtBytes(blob.size)}.`);
      if(ptxt) ptxt.innerHTML=`<span>Esportazione completata</span><span>${fmtBytes(blob.size)}</span>`;
      if(fill) fill.style.width='100%';
    }catch(err){
      console.error('[Uni Notes Export]',err);
      Toast.error('Esportazione non riuscita: ' + (err.message || 'errore sconosciuto'));
      if(ptxt) ptxt.innerHTML=`<span>Esportazione interrotta</span><span></span>`;
    }finally{
      if(btn) btn.disabled=false;
    }
  },

  render(){
    TopbarView.render(`<b>Esporta / Scarica</b>`, `<button class="btn btn-sm" id="export-refresh">${icon('refresh',14)} Aggiorna elenco</button>`);
    const content=document.getElementById('content');
    content.innerHTML=`<div class="page">
      <div class="export-hero">
        <div><div class="export-kicker">Centro esportazione</div><div class="export-title">Scarica esattamente ciò che ti serve.</div><div class="export-sub">Combina materie, singole lezioni ed estensioni. Uni Notes crea un unico ZIP mantenendo la struttura della libreria, senza modificare alcun file originale.</div></div>
        <div class="export-toolbar"><button class="btn btn-sm" id="export-select-all">${icon('checkCircle',14)} Tutte le lezioni</button><button class="btn btn-sm" id="export-clear-all">${icon('x',14)} Nessuna lezione</button></div>
      </div>
      <div id="export-main"><div class="export-card"><div class="export-card-body"><div class="export-empty">Analizzo la libreria…</div></div></div></div>
    </div>`;
    document.getElementById('export-refresh')?.addEventListener('click', async()=>{ await this.loadAndRender(); });
    content.querySelector('#export-select-all').onclick=()=>this.setAllLessons(true);
    content.querySelector('#export-clear-all').onclick=()=>this.setAllLessons(false);
    this.loadAndRender();
  },

  async loadAndRender(){
    const main=document.getElementById('export-main');
    if(main) main.innerHTML=`<div class="export-card"><div class="export-card-body"><div class="export-empty">Analizzo la libreria…</div></div></div>`;
    await this.buildIndex();
    this.renderBody();
  },

  renderBody(){
    const main=document.getElementById('export-main'); if(!main || !this.state.ready) return;
    const exts=this.allExtensions();
    const selected=this.selectedRecords();
    const total=this.state.records.length;
    const selectedSize=this.selectionSize();
    const subjectLessonCount=this.state.selectedLessons.size;
    const subjectCount=this.selectedLessonSubjectIds().size;
    const subjectRows=AppState.library.subjects.map(s=>{
      const count=s.lessons.filter(l=>this.state.selectedLessons.has(l.id)).length;
      return `<div class="export-subject">
        <div class="export-subject-head" data-subject-toggle="${esc(s.id)}">
          <input class="export-check" type="checkbox" data-subject-check="${esc(s.id)}" ${count===s.lessons.length && s.lessons.length ? 'checked':''} ${count===0?'':'data-partial="1"'}>
          <div class="export-subject-title">${esc(s.name)}</div><div class="export-subject-meta">${count}/${s.lessons.length} lezioni</div>${icon('chevronDown',14)}
        </div>
        <div class="export-subject-lessons" style="display:${this.state.subjectOpen[s.id]===false?'none':'grid'}">
          ${s.lessons.map(l=>`<label class="export-lesson-row"><input class="export-check" type="checkbox" data-lesson-check="${esc(l.id)}" ${this.state.selectedLessons.has(l.id)?'checked':''}><span class="export-lesson-name">${esc(l.title || `Lezione ${l.number ?? ''}` || l.folderName)}</span><span style="font-size:10px;color:var(--text-tertiary);">${l.date?fmtDateShort(l.date):''}</span></label>`).join('')}
        </div>
      </div>`;
    }).join('');
    const presets=[['all','Tutto'],['pdf','Solo PDF'],['audio','Solo audio'],['docs','Documenti / testi'],['images','Immagini'],['none','Azzera']];
    const typeRows=exts.map(ext=>{
      const count=this.state.records.filter(r=>!r.isSystem && !r.isAi && (r.ext||'(nessuna estensione)')===ext).length;
      const size=this.state.records.filter(r=>!r.isSystem && !r.isAi && (r.ext||'(nessuna estensione)')===ext).reduce((n,r)=>n+(r.size||0),0);
      return `<label class="export-type"><input class="export-check" type="checkbox" data-ext-check="${esc(ext)}" ${this.state.selectedExts.has(ext)?'checked':''}><div class="export-type-info"><div class="export-type-name">${esc(this.extensionLabel(ext))}</div><div class="export-type-meta">${count} file · ${fmtBytes(size)}</div></div><span style="font-size:10px;color:var(--text-tertiary);">${esc(this.extensionGroup(ext))}</span></label>`;
    }).join('');
    const preview=selected.slice(0,12).map(r=>`<div class="export-preview-row">${icon(r.isAi?'notes':r.ext==='pdf'?'pdf':r.ext && ['mp3','m4a','wav','aac','ogg','flac','opus'].includes(r.ext)?'mic':'file',13)}<span class="export-preview-path" title="${esc(r.relPath)}">${esc(r.relPath)}</span><span>${fmtBytes(r.size)}</span></div>`).join('');
    main.innerHTML=`<div class="export-grid">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0;">
        <section class="export-card">
          <div class="export-card-head"><div><div class="export-card-title">1. Cosa esportare</div><div class="export-card-sub">Seleziona materie intere o singole lezioni.</div></div><span class="export-select-all" id="export-select-all-small">Seleziona tutto</span></div>
          <div class="export-card-body"><div class="export-list">${subjectRows || '<div class="export-empty">Nessuna materia disponibile.</div>'}</div></div>
        </section>
        <section class="export-card">
          <div class="export-card-head"><div><div class="export-card-title">2. Quali file</div><div class="export-card-sub">Puoi scegliere ogni estensione presente nella libreria.</div></div><div class="export-actions"><span class="export-select-all" id="export-ext-all">Tutte</span><span style="color:var(--text-tertiary)">·</span><span class="export-select-all" id="export-ext-none">Nessuna</span></div></div>
          <div class="export-card-body">
            <div class="export-chip-row" style="margin-bottom:10px;">${presets.map(([k,l])=>`<button class="export-chip ${((k==='all' && this.state.selectedExts.size===exts.length)||(k==='none'&&this.state.selectedExts.size===0))?'active':''}" data-export-preset="${k}">${l}</button>`).join('')}</div>
            <div class="export-type-grid">${typeRows || '<div class="export-empty">Nessun tipo di file trovato.</div>'}</div>
            <div class="field" style="margin-top:10px;"><label>Estensioni personalizzate</label><input id="export-custom-ext" class="export-ext-input" placeholder="es. pdf, mp3, md, csv" value="${esc(this.state.customExts)}"><div class="export-note" style="margin-top:6px;">Le estensioni qui indicate vengono aggiunte alla selezione. Separale con virgole, spazi o punto e virgola.</div></div>
          </div>
        </section>
        <section class="export-card">
          <div class="export-card-head"><div><div class="export-card-title">3. Opzioni avanzate</div><div class="export-card-sub">Decidi cosa fare dei file speciali e della struttura finale.</div></div></div>
          <div class="export-card-body">

/* ============================================================

   ============================================================ */
const CommandPalette = {
  selected: 0, items: [],
  open(prefill){
    document.getElementById('cmdk-backdrop').classList.add('show');
    const input = document.getElementById('cmdk-input');
    input.value = prefill || '';
    input.focus();
    this.renderResults(input.value);
    input.oninput = () => this.renderResults(input.value);
    input.onkeydown = (e) => this.handleKey(e);
  },
  close(){
    document.getElementById('cmdk-backdrop').classList.remove('show');
  },
  staticCommands(){
    return [
      { label:'Nuova lezione', icon:'plus', action:()=>LessonFormModal.open() },
      { label:'Nuova materia', icon:'plus', action:()=>SubjectFormModal.open() },
      { label:'Vai a Dashboard', icon:'dashboard', action:()=>Router.go('dashboard') },
      { label:'Vai a Materie', icon:'subject', action:()=>Router.go('subjects') },
      { label:'Vai a Ricerca', icon:'search', action:()=>Router.go('search') },
      { label:'Vai a Calendario', icon:'calendar', action:()=>Router.go('calendar') },
      { label:'Vai a Prompt', icon:'prompt', action:()=>Router.go('prompts') },
      { label:'Vai ad Attività', icon:'activity', action:()=>Router.go('activity') },
      { label:'Vai a Statistiche', icon:'statistics', action:()=>Router.go('statistics') },
      { label:'Esporta / Scarica file', icon:'download', action:()=>Router.go('export') },
      { label:'Vai a Lezioni preferite', icon:'star', action:()=>Router.go('lessons-pinned') },
      { label:'Vai a Impostazioni', icon:'settings', action:()=>Router.go('settings') },
      { label:'Sincronizza libreria', icon:'refresh', action:()=>Router.resync() }
    ];
  },
  renderResults(query){
    const el = document.getElementById('cmdk-results');
    let items = [];
    if(!query.trim()){
      items = this.staticCommands().map(c => ({ type:'cmd', ...c }));
    } else {
      const r = SearchEngine.search(query);
      const cmds = this.staticCommands().filter(c => SearchEngine.fuzzyScore(query,c.label)>=0).map(c=>({type:'cmd',...c}));
      const subj = r.subjects.slice(0,5).map(({item})=>({type:'subject', label:item.name, icon:'subject', action:()=>Router.go('subject',{subjectName:item.name})}));
      const less = r.lessons.slice(0,5).map(({item})=>({type:'lesson', label:`Lezione ${item.number??''} — ${item.title||item.subjectName}`, icon:'lesson', action:()=>Router.go('lesson',{subjectName:item.subjectName, lessonId:item.id})}));
      items = [...cmds, ...subj, ...less];
    }
    this.items = items;
    this.selected = 0;
    el.innerHTML = items.length ? items.map((it,i) => `
      <div class="cmdk-item ${i===0?'selected':''}" data-idx="${i}">
        ${icon(it.icon,15)}<span>${esc(it.label)}</span>
      </div>
    `).join('') : `<div style="padding:20px; text-align:center; color:var(--text-tertiary); font-size:13px;">Nessun risultato</div>`;
    el.querySelectorAll('[data-idx]').forEach(elm => {
      elm.addEventListener('click', () => this.run(parseInt(elm.dataset.idx,10)));
      elm.addEventListener('mouseenter', () => { this.selected = parseInt(elm.dataset.idx,10); this.highlight(); });
    });
  },
  highlight(){
    document.querySelectorAll('#cmdk-results .cmdk-item').forEach((el,i) => el.classList.toggle('selected', i===this.selected));
    const sel = document.querySelector('#cmdk-results .cmdk-item.selected');
    if(sel) sel.scrollIntoView({ block:'nearest' });
  },
  handleKey(e){
    if(e.key === 'ArrowDown'){ e.preventDefault(); this.selected = Math.min(this.items.length-1, this.selected+1); this.highlight(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); this.selected = Math.max(0, this.selected-1); this.highlight(); }
    else if(e.key === 'Enter'){ e.preventDefault(); this.run(this.selected); }
    else if(e.key === 'Escape'){ this.close(); }
  },
  run(idx){
    const it = this.items[idx];
    if(!it) return;
    this.close();
    it.action();
  }
};

/* ============================================================
   PWA — manifest e service worker generati come Blob (single-file)
   ============================================================ */
function setupPWA(){
  const isWebOrigin = location.protocol === 'http:' || location.protocol === 'https:';
  const manifest = {
    name: 'Uni Notes',
    short_name: 'Uni Notes',
    ...(isWebOrigin ? { start_url: location.href.split('#')[0] } : {}),
    display: 'standalone',
    background_color: '#EEECE7',
    theme_color: '#3457D5',
    orientation: 'any',
    icons: [
      ...(isWebOrigin ? [{
        src: new URL('./icon.png', location.href).href,
        sizes: '192x192 512x512',
        type: 'image/png'
      }] : [])
    ]
  };
  try{
    const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    const link = document.getElementById('uninotes-manifest');
    if(link) link.href = url;
  }catch(e){ console.warn('Manifest PWA non disponibile', e); }

  // Il service worker dinamico Blob non è affidabile per una pagina standalone/file://
  // e può generare richieste o errori di origine non necessari. L'app resta pienamente
  // utilizzabile senza service worker; la cache locale dei dati resta gestita da localStorage/FS API.
}

async function boot(){
  AppState.init();
  CalendarStore.init();
  window.addEventListener('uninotes:print-settings-changed', () => { Router.render(); });
  setupPWA();
  SetupScreen.render();

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.deferredPwaPrompt = e;
  });

  // Global keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); CommandPalette.open(''); return; }
    if(meta && e.shiftKey && e.key.toLowerCase()==='p'){ e.preventDefault(); CommandPalette.open(''); return; }
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    const editable = tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable);
    if(e.key === '/' && !meta){
      if(!editable){ e.preventDefault(); Router.go('search'); return; }
    }
    if(meta && !editable && e.key.toLowerCase()==='j'){
      e.preventDefault();
      const order = ['light','dark','system'];
      const next = order[(order.indexOf(AppState.theme)+1) % order.length];
      AppState.setTheme(next);
      Toast.info(`Tema: ${next}`);
      return;
    }
    if(meta && !editable && e.key.toLowerCase()==='n'){ e.preventDefault(); LessonFormModal.open(); return; }
    if(meta && e.key===','){ e.preventDefault(); Router.go('settings'); return; }
    if(e.key === 'Escape'){
      const cmdk = document.getElementById('cmdk-backdrop');
      if(cmdk.classList.contains('show')){ CommandPalette.close(); return; }
    }
  });

  document.getElementById('cmdk-backdrop').addEventListener('click', (e) => {
    if(e.target.id === 'cmdk-backdrop') CommandPalette.close();
  });
  document.getElementById('mobile-nav-backdrop')?.addEventListener('click', () => MobileNav.close());
  MobileBottomNav.init();

  // Sync when tab becomes active again (compatible mechanism)
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && AppState.dirHandle && AppState.route.page && document.getElementById('app') && !document.getElementById('app').classList.contains('hidden')){
      // Silent light resync could be added here; kept manual via button to avoid surprise UI shifts.
    }
  });

  // Su mobile, se era stata importata una cartella, mostriamo un reconnect rapido.
  if(MobileFolderBridge.isMobile() && MobileFolderBridge.supported()){
    const mobileRecall = SettingsManager.recallMobileFolder();
    if(mobileRecall && !FileSystemManager.supported()){
      SetupScreenReconnect.renderMobile(mobileRecall.name);
      return;
    }
  }

  // Try to recall previously connected folder
  try{
    const handle = await SettingsManager.recallFolder();
    if(handle){
      const granted = await handle.queryPermission({ mode:'readwrite' });
      if(granted === 'granted'){
        AppState.dirHandle = handle; AppState.dirName = handle.name;
        const lib = await LibraryScanner.scan(handle);
        AppState.library = lib;
        finishBoot();
        return;
      } else {
        // Need user gesture to re-request permission — show a reconnect option
        SetupScreenReconnect.render(handle);
        return;
      }
    }
  }catch(err){ console.warn('Recall cartella fallito', err); }
}

const SetupScreenReconnect = {
  renderMobile(folderName){
    const el = document.getElementById('setup-screen');
    el.innerHTML = `
      <div class="setup-logo">U</div>
      <div class="setup-title">Cartella mobile precedente</div>
      <div class="setup-sub">Hai usato <b>${esc(folderName || 'questa cartella')}</b>. Selezionala di nuovo per aggiornarne i contenuti.</div>
      <div class="setup-actions">
        <button class="btn btn-primary" id="btn-mobile-reconnect" style="padding:10px 20px; font-size:14px;">${icon('folder',16)} Seleziona di nuovo</button>
      </div>
      <div class="mobile-source-note">Su iPhone/iPad il browser non mantiene un handle permanente della cartella. Gli stati personali di Uni Notes restano invece salvati sul dispositivo.</div>
      <input type="file" id="mobile-folder-input" webkitdirectory multiple style="display:none;" />
    `;
    el.querySelector('#btn-mobile-reconnect').addEventListener('click', () => SetupScreen.pickMobileFolder());
  },
  render(handle){
    const el = document.getElementById('setup-screen');
    el.innerHTML = `
      <div class="setup-logo">U</div>
      <div class="setup-title">Bentornato in Uni Notes</div>
      <div class="setup-sub">Riconnetti la cartella "${esc(handle.name)}" per continuare da dove avevi lasciato.</div>
      <div class="setup-actions">
        <button class="btn btn-primary" id="btn-reconnect" style="padding:10px 20px; font-size:14px;">${icon('folder',16)} Riconnetti cartella</button>
        <button class="btn" id="btn-pick-new" style="padding:8px 16px; font-size:13px;">Seleziona un'altra cartella</button>
      </div>
    `;
    el.querySelector('#btn-reconnect').addEventListener('click', async () => {
      const ok = await FileSystemManager.verifyPermission(handle, true);
      if(!ok){ Toast.error('Permesso negato.'); return; }
      await SetupScreen.completeSetup(handle);
    });
    el.querySelector('#btn-pick-new').addEventListener('click', () => SetupScreen.pickFolder());
  }
};

boot();

<script>
/* ============================================================
   UNI NOTES — AGENTE AI LOCALE (Ollama)
   ------------------------------------------------------------
   Questo file si aggancia all'app Uni Notes esistente SENZA
   duplicarne la logica: chiama sempre gli stessi oggetti globali
   già definiti nello script principale (FileSystemManager,
   LibraryScanner, AppState, Router, ContentIndex, PDFViewerModal,
   FileViewer, ModalManager, Toast, icon/ICONS, ecc.).
   Va incluso con un tag <script> DOPO lo script principale, es.:

     <script src="uninotes-ai-agent.js"><\/script>

   subito prima di </body>. Non richiede build, bundler o backend:
   parla solo con Ollama in locale (http://localhost:11434).
   ============================================================ */
(function(){
'use strict';

/* ---------- Icone aggiuntive (estendono ICONS già esistente) ---------- */
if(typeof ICONS !== 'undefined'){
  ICONS.ai = ICONS.ai || '<path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 14l.6 1.8L21.5 16.5l-1.9.7L19 19l-.6-1.8-1.9-.7 1.9-.7L19 14z"/>';
  ICONS.send = ICONS.send || '<path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/>';
  ICONS.stopcircle = ICONS.stopcircle || '<circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/>';
}

/* ============================================================
   OLLAMA MANAGER
   ============================================================ */
const OllamaManager = {
  baseUrl: 'http://localhost:11434',
  getModel(){ return localStorage.getItem('uninotes.ollamaModel') || ''; },
  setModel(m){ localStorage.setItem('uninotes.ollamaModel', m || ''); },

  async testConnection(){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 4000);
      const res = await fetch(this.baseUrl + '/api/tags', { signal: ctrl.signal });
      clearTimeout(t);
      if(!res.ok) return { ok:false, error:'HTTP ' + res.status };
      const data = await res.json();
      return { ok:true, models: (data.models||[]).map(m=>m.name) };
    }catch(err){
      const corsLike = (typeof err.message === 'string' && /fetch|network|cors/i.test(err.message));
      return { ok:false, error: err.name==='AbortError' ? 'timeout' : (err.message || 'errore di rete'), cors: corsLike };
    }
  },
  async listModels(){ const r = await this.testConnection(); return r.ok ? r.models : []; },

  /**
   * Invia una chat a Ollama. Se onToken è passato, usa lo streaming NDJSON
   * e richiama onToken per ogni frammento di testo della risposta finale.
   * Se onThinking è passato, richiede al modello (quando supportato, es.
   * gpt-oss) anche il "thinking"/ragionamento e lo trasmette in streaming
   * separatamente tramite onThinking, senza mescolarlo alla risposta finale.
   * Ritorna sempre il messaggio finale { role, content, thinking, tool_calls }.
   */
  async chat({ messages, tools, signal, onToken, onThinking }){
    const model = this.getModel();
    if(!model) throw new Error('Nessun modello Ollama selezionato.');
    const stream = !!onToken || !!onThinking;
    const body = { model, messages, stream };
    if(tools && tools.length) body.tools = tools;
    if(onThinking) body.think = true;
    let res;
    try{
      res = await fetch(this.baseUrl + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal
      });
    }catch(err){
      if(err.name === 'AbortError') throw err;
      throw new Error('Impossibile contattare Ollama su ' + this.baseUrl + ' (' + (err.message||'errore di rete') + '). Se questa pagina è servita da GitHub Pages, potrebbe essere necessario configurare OLLAMA_ORIGINS.');
    }
    if(!res.ok){
      const t = await res.text().catch(()=> '');
      throw new Error('Ollama ha risposto con errore HTTP ' + res.status + (t ? ': ' + t.slice(0,200) : ''));
    }
    if(!stream){
      const data = await res.json();
      return data.message || { role:'assistant', content:'' };
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    const finalMsg = { role:'assistant', content:'', thinking:'', tool_calls: undefined };
    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        let obj;
        try{ obj = JSON.parse(line); }catch(e){ continue; }
        if(obj.message){
          if(obj.message.thinking){ finalMsg.thinking += obj.message.thinking; if(onThinking) onThinking(obj.message.thinking); }
          if(obj.message.content){ finalMsg.content += obj.message.content; if(onToken) onToken(obj.message.content); }
          if(obj.message.tool_calls) finalMsg.tool_calls = obj.message.tool_calls;
        }
      }
    }
    return finalMsg;
  }
};

window.OllamaManager = OllamaManager; // esposta a window per debug/console

/* ============================================================
   PERMESSI AI
   ============================================================ */
const AIPermissions = {
  mode(){ return localStorage.getItem('uninotes.aiMode') || 'balanced'; },
  setMode(m){ localStorage.setItem('uninotes.aiMode', m); }
};

/* ============================================================
   INDICE PDF — riusa pdf.js già caricato dall'app (ensurePdfJs)
   e caching in IndexedDB per non ri-estrarre PDF invariati.
   ============================================================ */
const PdfIndex = {
  entries: [],
  ready: false,
  building: false,
  dbPromise: null,

  db(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open('uninotes-pdfindex', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('pages', { keyPath:'fileKey' }); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return this.dbPromise;
  },
  async getCached(fileKey){
    try{
      const db = await this.db();
      return await new Promise((res)=>{
        const tx = db.transaction('pages','readonly');
        const req = tx.objectStore('pages').get(fileKey);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      });
    }catch(e){ return null; }
  },
  async putCached(entry){
    try{
      const db = await this.db();
      const tx = db.transaction('pages','readwrite');
      tx.objectStore('pages').put(entry);
    }catch(e){ /* non bloccante */ }
  },

  allPdfTargets(){
    const targets = [];
    allLessonsFlat().forEach(l=>{
      const seen = new Set();
      const pdfs = [];
      if(l.mainFile && l.mainFile.kind === 'pdf'){ pdfs.push(l.mainFile); seen.add(l.mainFile.name); }
      (l.files.pdf||[]).forEach(f=>{ if(!seen.has(f.name)){ pdfs.push(f); seen.add(f.name); } });
      pdfs.forEach(f=>targets.push({ l, f }));
    });
    return targets;
  },

  async build(){
    if(this.building) return;
    // L'indicizzazione PDF è pesante: non deve competere con l'automazione AI.
    while(window.UniNotesAIBackground && window.UniNotesAIBackground.running){
      await new Promise(r=>setTimeout(r,600));
    }
    this.building = true;
    window.UniNotesPdfIndexBusy = true;
    const targets = this.allPdfTargets();
    const newEntries = [];
    for(const { l, f } of targets){
      const fileKey = `${l.subjectName}::${l.id}::${f.name}`;
      try{
        const fileObj = await f.handle.getFile();
        const cached = await this.getCached(fileKey);
        if(cached && cached.mtime === fileObj.lastModified){
          newEntries.push(cached);
          continue;
        }
        await ensurePdfJs();
        const buf = await fileObj.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        const pages = [];
        for(let p=1; p<=pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const tc = await page.getTextContent();
          pages.push({ page: p, text: tc.items.map(it=>it.str).join(' ') });
        }
        const entry = { fileKey, subjectName:l.subjectName, lessonId:l.id, lessonNumber:l.number, fileName:f.name, pages, mtime: fileObj.lastModified };
        await this.putCached(entry);
        newEntries.push(entry);
      }catch(err){
        console.warn('[PdfIndex] impossibile indicizzare', f.name, err);
      }
    }
    this.entries = newEntries;
    this.ready = true;
    this.building = false;
    window.UniNotesPdfIndexBusy = false;
  },
  invalidate(){ this.ready = false; this.build(); },
  async ensureFresh(){
    if(this.ready || this.building) return;
    try{ await this.build(); }finally{ this.building=false; window.UniNotesPdfIndexBusy=false; }
  },

  search(query){
    const q = (query||'').trim().toLowerCase();
    if(!q) return [];
    const out = [];
    this.entries.forEach(entry=>{
      entry.pages.forEach(pg=>{
        const lower = pg.text.toLowerCase();
        const idx = lower.indexOf(q);
        if(idx === -1) return;
        const start = Math.max(0, idx-60), end = Math.min(lower.length, idx+q.length+60);
        const snippet = (start>0?'…':'') + pg.text.slice(start,end).replace(/\s+/g,' ') + (end<lower.length?'…':'');
        out.push({ subjectName: entry.subjectName, lessonId: entry.lessonId, lessonNumber: entry.lessonNumber, fileName: entry.fileName, page: pg.page, snippet });
      });
    });
    return out;
  },
  getContext(subjectName, lessonId, fileName, page){
    const entry = this.entries.find(e=>e.subjectName===subjectName && e.lessonId===lessonId && e.fileName===fileName);
    if(!entry) return null;
    const pg = entry.pages.find(p=>p.page===page);
    return pg ? pg.text : null;
  }
};

/* ============================================================
   CRONOLOGIA CHAT (IndexedDB, solo locale)
   ============================================================ */
const ChatHistoryStore = {
  dbPromise: null,
  db(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open('uninotes-chats', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('conversations', { keyPath:'id' }); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return this.dbPromise;
  },
  async list(){
    const db = await this.db();
    return new Promise((res,rej)=>{
      const tx = db.transaction('conversations','readonly');
      const req = tx.objectStore('conversations').getAll();
      req.onsuccess = () => res((req.result||[]).sort((a,b)=>b.updatedAt-a.updatedAt));
      req.onerror = () => rej(req.error);
    });
  },
  async save(convo){
    const db = await this.db();
    return new Promise((res,rej)=>{
      const tx = db.transaction('conversations','readwrite');
      tx.objectStore('conversations').put(convo);
      tx.oncomplete = () => res(convo);
      tx.onerror = () => rej(tx.error);
    });
  },
  async delete(id){
    const db = await this.db();
    const tx = db.transaction('conversations','readwrite');
    tx.objectStore('conversations').delete(id);
  }
};

/* ============================================================
   HELPER FILESYSTEM CONDIVISI (riusano FileSystemManager/LibraryScanner)
   ============================================================ */
function resolveFileInLesson(lesson, fileName){
  if(lesson.mainFile && lesson.mainFile.name === fileName) return { file: lesson.mainFile, source: 'mainFile' };
  const other = (lesson.otherRootFiles||[]).find(f=>f.name===fileName);
  if(other) return { file: other, source: 'root' };
  for(const role in lesson.files){
    const f = (lesson.files[role]||[]).find(x=>x.name===fileName);
    if(f) return { file: f, source: role };
  }
  return null;
}

async function getParentDirHandle(lesson, file, source){
  if(source === 'mainFile' || source === 'root' || !file.folder) return lesson.handle;
  if(typeof window !== 'undefined' && window.UniNotesAISummaryFolder && file.folder === window.UniNotesAISummaryFolder){
    return await lesson.handle.getDirectoryHandle(window.UniNotesAISummaryFolder,{create:false});
  }
  const match = (lesson.subfolders||[]).find(sf => sf.folderPath===file.folder || sf.name===file.folder || (RAW_FOLDER_NAME+'/'+sf.name)===file.folder);
  if(match) return match.handle;
  const roleKey = Object.keys(CATEGORY_FOLDERS).find(k => CATEGORY_FOLDERS[k] === file.folder);
  if(roleKey) return await LibraryScanner.getOrCreateCategoryFolder(lesson, roleKey);
  return await LibraryScanner.getRawFolder(lesson);
}

/* ============================================================
   UNI NOTES API — livello di servizio condiviso tra UI e AI.
   Chiama SEMPRE FileSystemManager/LibraryScanner esistenti: qui
   non viene reimplementata alcuna logica di basso livello.
   ============================================================ */
const UniNotesAPI = {
  subjects: {
    list(){
      return AppState.library.subjects.map(s=>({
        name: s.name, docente: s.docente, codice: s.codice, aula: s.aula,
        lessonCount: s.lessons.length, stats: subjectStats(s)
      }));
    },
    async create({ name, docente='', codice='', aula='' }){
      if(!name || !name.trim()) throw new Error('Nome materia mancante.');
      name = name.trim();
      if(findSubject(name)) throw new Error('Esiste già una materia chiamata "'+name+'".');
      if(!AppState.dirHandle) throw new Error('Nessuna cartella collegata a Uni Notes.');
      const handle = await FileSystemManager.createSubDir(AppState.dirHandle, name);
      const meta = { docente, codice, aula };
      const metaHandle = await FileSystemManager.getOrCreateFile(handle, '.subject.json');
      await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(meta, null, 2));
      const subject = { id:'subj_'+name, name, handle, docente, codice, aula, color: pickColor(name), lessons: [] };
      AppState.library.subjects.push(subject);
      AppState.library.subjects.sort((a,b)=>a.name.localeCompare(b.name,'it'));
      AppState.logActivity(name, 'Materia creata (AI)');
      return subject;
    },
    async update({ subjectName, changes={} }){
      const s = findSubject(subjectName);
      if(!s) throw new Error('Materia non trovata: '+subjectName);
      Object.assign(s, changes);
      const metaHandle = await FileSystemManager.getOrCreateFile(s.handle, '.subject.json');
      let existing = {}; try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
      Object.assign(existing, { docente: s.docente, codice: s.codice, aula: s.aula, color: s.color });
      await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
      AppState.logActivity(subjectName, 'Materia modificata (AI)');
      return s;
    },
    async delete({ subjectName }){
      const s = findSubject(subjectName);
      if(!s) throw new Error('Materia non trovata: '+subjectName);
      await FileSystemManager.deleteEntry(AppState.dirHandle, s.name);
      AppState.library.subjects = AppState.library.subjects.filter(x=>x.name!==subjectName);
      AppState.logActivity(subjectName, 'Materia eliminata (AI)');
      return true;
    }
  },

  lessons: {
    async create({ subjectName, number=null, date=null, title='', docente='', tags=[], notes='' }){
      const s = findSubject(subjectName);
      if(!s) throw new Error('Materia non trovata: '+subjectName);
      const d = date ? new Date(date) : new Date();
      const n = number != null ? Number(number) : (s.lessons.reduce((mx,l)=>Math.max(mx,l.number||0),0) + 1);
      const topic = requiredLessonTitle(title);
      if(!Number.isFinite(n) || n < 1) throw new Error('Il numero della lezione è obbligatorio e deve essere maggiore di 0.');
      if(!topic) throw new Error('L’argomento è obbligatorio. Usa il formato: Lezione X - argomento.');
      const folderName = lessonDisplayName({ number:n, title:topic });
      const handle = await FileSystemManager.createSubDir(s.handle, folderName);
      const metaHandle = await FileSystemManager.getOrCreateFile(handle, '.lesson.json');
      const createdAt = new Date().toISOString();
      const meta = { number:n, date: d.toISOString(), createdAt, title:topic, docente, tags, notes };
      await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(meta, null, 2));
      const lesson = {
        id: 'lesson_'+subjectName+'_'+folderName, folderName, handle, subjectName,
        number:n, date:d, createdAt, title:topic, docente, tags, notes, pinned:false, order:null,
        files:{}, subfolders:[], mainFile:null, otherRootFiles:[], rawFolderHandle:null
      };
      s.lessons.push(lesson);
      s.lessons.sort((a,b)=>(a.number||0)-(b.number||0));
      AppState.logActivity(subjectName, `Lezione "${title||folderName}" creata (AI)`);
      return lesson;
    },
    async update({ subjectName, lessonId, changes={} }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const c = Object.assign({}, changes);
      if(c.date) c.date = new Date(c.date);
      if(Object.prototype.hasOwnProperty.call(c,'title')){
        c.title = requiredLessonTitle(c.title);
        if(!c.title) throw new Error('L’argomento è obbligatorio.');
      }
      if(Object.prototype.hasOwnProperty.call(c,'number')){
        c.number = Number(c.number);
        if(!Number.isFinite(c.number) || c.number < 1) throw new Error('Il numero della lezione è obbligatorio e deve essere maggiore di 0.');
      }
      Object.assign(lesson, c);
      const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
      let existing = {}; try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
      Object.assign(existing, { number: lesson.number, date: lesson.date ? lesson.date.toISOString() : null, title: lesson.title, docente: lesson.docente, tags: lesson.tags, notes: lesson.notes });
      await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
      AppState.logActivity(subjectName, `Lezione modificata (AI): ${lesson.title||lesson.folderName}`);
      return lesson;
    },
    async delete({ subjectName, lessonId }){
      const s = findSubject(subjectName);
      const lesson = findLesson(subjectName, lessonId);
      if(!s || !lesson) throw new Error('Lezione non trovata.');
      await FileSystemManager.deleteEntry(s.handle, lesson.folderName);
      s.lessons = s.lessons.filter(l=>l.id!==lessonId);
      AppState.logActivity(subjectName, 'Lezione eliminata (AI)');
      return true;
    },
    async togglePin({ subjectName, lessonId }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      return await LibraryScanner.togglePinned(lesson);
    }
  },

  files: {
    resolve(lesson, fileName){ return resolveFileInLesson(lesson, fileName); },
    async read({ subjectName, lessonId, fileName }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) throw new Error('File non trovato: '+fileName);
      const ext = extOf(fileName);
      if(ext === 'pdf') throw new Error('Per i PDF usa search_pdf_content o get_pdf_context (indicano anche la pagina).');
      if(ext === 'docx') throw new Error('La lettura diretta di un DOCX non è supportata dai tool AI: apri il file nell\'editor per consultarlo.');
      return await FileSystemManager.readTextFile(found.file.handle);
    },
    async write({ subjectName, lessonId, fileName, content }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) return await this.create({ subjectName, lessonId, fileName, content });
      await FileSystemManager.writeTextFile(found.file.handle, content);
      AppState.logActivity(subjectName, `"${fileName}" aggiornato (AI)`);
      return true;
    },
    async create({ subjectName, lessonId, fileName, content='' }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const kind = kindOf(fileName);
      const role = LibraryScanner.classifyFile(fileName, kind);
      const destFolder = await LibraryScanner.getOrCreateCategoryFolder(lesson, role);
      const handle = await FileSystemManager.getOrCreateFile(destFolder, fileName);
      await FileSystemManager.writeTextFile(handle, content || '');
      lesson.files[role] = lesson.files[role] || [];
      const idx = lesson.files[role].findIndex(f=>f.name===fileName);
      const entry = { name: fileName, handle, kind, folder: CATEGORY_FOLDERS[role] ? (RAW_FOLDER_NAME+'/'+CATEGORY_FOLDERS[role]) : RAW_FOLDER_NAME };
      if(idx>=0) lesson.files[role][idx] = entry; else lesson.files[role].push(entry);
      AppState.logActivity(subjectName, `"${fileName}" creato (AI)`);
      ContentIndex.invalidate();
      return entry;
    },
    async rename({ subjectName, lessonId, fileName, newName }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) throw new Error('File non trovato: '+fileName);
      const parent = await getParentDirHandle(lesson, found.file, found.source);
      await FileSystemManager.renameFile(parent, fileName, newName);
      found.file.name = newName;
      found.file.handle = await parent.getFileHandle(newName);
      AppState.logActivity(subjectName, `"${fileName}" rinominato in "${newName}" (AI)`);
      ContentIndex.invalidate();
      return true;
    },
    async delete({ subjectName, lessonId, fileName }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) throw new Error('File non trovato: '+fileName);
      const parent = await getParentDirHandle(lesson, found.file, found.source);
      await FileSystemManager.deleteEntry(parent, fileName);
      if(found.source === 'mainFile') lesson.mainFile = null;
      else if(found.source === 'root') lesson.otherRootFiles = (lesson.otherRootFiles||[]).filter(f=>f.name!==fileName);
      else lesson.files[found.source] = (lesson.files[found.source]||[]).filter(f=>f.name!==fileName);
      AppState.logActivity(subjectName, `"${fileName}" eliminato (AI)`);
      ContentIndex.invalidate();
      return true;
    },
    async moveToFolder({ subjectName, lessonId, fileName, folderName }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) throw new Error('File non trovato: '+fileName);
      const oldParent = await getParentDirHandle(lesson, found.file, found.source);
      const raw = await LibraryScanner.getRawFolder(lesson);
      let sub = (lesson.subfolders||[]).find(sf=>sf.name===folderName);
      let newFolderHandle;
      if(sub) newFolderHandle = sub.handle;
      else{
        newFolderHandle = await FileSystemManager.createSubDir(raw, folderName);
        lesson.subfolders.push({ name: folderName, handle: newFolderHandle, role:null, folderPath: RAW_FOLDER_NAME+'/'+folderName });
      }
      const fileObj = await found.file.handle.getFile();
      const newHandle = await FileSystemManager.copyFileInto(newFolderHandle, fileObj, fileName);
      await FileSystemManager.deleteEntry(oldParent, fileName);
      if(found.source === 'mainFile') lesson.mainFile = null;
      else if(found.source === 'root') lesson.otherRootFiles = (lesson.otherRootFiles||[]).filter(f=>f.name!==fileName);
      else lesson.files[found.source] = (lesson.files[found.source]||[]).filter(f=>f.name!==fileName);
      const kind = kindOf(fileName);
      const role = LibraryScanner.classifyFile(fileName, kind);
      lesson.files[role] = lesson.files[role] || [];
      lesson.files[role].push({ name: fileName, handle: newHandle, kind, folder: RAW_FOLDER_NAME+'/'+folderName });
      AppState.logActivity(subjectName, `"${fileName}" spostato in "${folderName}" (AI)`);
      ContentIndex.invalidate();
      return true;
    },
    async setMain({ subjectName, lessonId, fileName }){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) throw new Error('Lezione non trovata.');
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) throw new Error('Il documento principale può essere impostato solo tra i file sciolti nella root della lezione: "'+fileName+'" non è tra questi.');
      await LibraryScanner.setMainFile(lesson, found.file);
      AppState.logActivity(subjectName, `Documento principale impostato (AI): ${fileName}`);
      return true;
    }
  },

  search: {
    fullText(query){
      const r = SearchEngine.search(query);
      const contentHits = ContentIndex.ready ? ContentIndex.search(query) : [];
      const out = [];
      r.lessons.slice(0,10).forEach(({item})=>out.push({ type:'lesson', subjectName:item.subjectName, lessonId:item.id, lessonNumber:item.number, title:item.title||item.folderName }));
      r.files.slice(0,10).forEach(({item,lesson})=>out.push({ type:'file', subjectName:lesson.subjectName, lessonId:lesson.id, lessonNumber:lesson.number, fileName:item.name }));
      contentHits.slice(0,10).forEach(ch=>out.push({ type:'content', subjectName:ch.lesson.subjectName, lessonId:ch.lesson.id, lessonNumber:ch.lesson.number, fileName:ch.file.name, snippet:ch.snippet }));
      return out;
    },
    pdf(query){ return PdfIndex.ready ? PdfIndex.search(query) : []; }
  },

  ui: {
    navigate(page, params){ Router.go(page, params||{}); },
    openSubject(subjectName){ Router.go('subject', { subjectName }); },
    openLesson(subjectName, lessonId){ Router.go('lesson', { subjectName, lessonId }); },
    openFile(subjectName, lessonId, fileName, page){
      const lesson = findLesson(subjectName, lessonId);
      if(!lesson) return;
      const found = resolveFileInLesson(lesson, fileName);
      if(!found) return;
      if(found.file.kind === 'pdf' && page) PDFViewerModal.open(lesson, found.file, { page });
      else FileViewer.open(lesson, found.file);
    }
  }
};

/* ============================================================
   AGENT LOOP
   ============================================================ */
const AIAgent = {
  running: false,
  controller: null,

  tryParseFallbackToolCall(content){
    if(!content) return null;
    const match = content.match(/\{[\s\S]*\}/);
    if(!match) return null;
    try{
      const obj = JSON.parse(match[0]);
      if(obj && typeof obj.tool === 'string' && AITools[obj.tool]) return obj;
    }catch(e){}
    return null;
  },

  async run(conversationMessages, { onToken, onThinking, onStep, maxSteps=12 } = {}){
    this.running = true;
    this.controller = new AbortController();
    const tools = getOllamaToolsSchema();
    let messages = conversationMessages.slice();
    let steps = 0;
    try{
      while(steps < maxSteps){
        steps++;
        let assistantMsg;
        try{
          assistantMsg = await OllamaManager.chat({ messages, tools, signal: this.controller.signal, onToken, onThinking });
        }catch(err){
          if(err.name === 'AbortError') return { aborted:true, messages };
          throw err;
        }
        messages.push({ role:'assistant', content: assistantMsg.content || '', tool_calls: assistantMsg.tool_calls });

        let toolCalls = assistantMsg.tool_calls;
        if(!toolCalls || !toolCalls.length){
          const fallback = this.tryParseFallbackToolCall(assistantMsg.content);
          if(fallback) toolCalls = [{ function: { name: fallback.tool, arguments: fallback.arguments || fallback.args || {} } }];
        }
        if(!toolCalls || !toolCalls.length){
          return { finalMessage: assistantMsg.content || '', messages };
        }

        for(const call of toolCalls){
          const name = (call.function && call.function.name) || call.name;
          let args = (call.function && call.function.arguments) || call.arguments || {};
          if(typeof args === 'string'){ try{ args = JSON.parse(args); }catch(e){ args = {}; } }
          const tool = AITools[name];
          if(!tool){
            const res = makeErr('Tool sconosciuto: '+name, 'unknown_tool');
            messages.push({ role:'tool', content: JSON.stringify(res) });
            if(onStep) onStep({ name, args, result:res, status:'done' });
            continue;
          }
          if(onStep) onStep({ name, args, status:'running' });
          if(tool.destructive && AIPermissions.mode() !== 'autonomous'){
            const confirmed = await AIConfirmGate.confirm(
              'L\'assistente vuole eseguire un\'operazione irreversibile:\n\n' + tool.description + '\n\nParametri: ' + JSON.stringify(args) + '\n\nConfermi?'
            );
            if(!confirmed){
              const res = makeErr('Operazione annullata dall\'utente.', 'user_cancelled');
              messages.push({ role:'tool', content: JSON.stringify(res) });
              if(onStep) onStep({ name, args, result:res, status:'cancelled' });
              continue;
            }
          }
          let result;
          try{ result = await tool.execute(args || {}); }
          catch(err){ result = makeErr(err.message || String(err)); }
          messages.push({ role:'tool', content: JSON.stringify(result) });
          if(onStep) onStep({ name, args, result, status:'done' });
        }
      }
      return { finalMessage: 'Ho raggiunto il numero massimo di passaggi consentiti senza completare la richiesta. Prova a essere più specifico o a dividerla in più richieste.', messages };
    } finally {
      this.running = false;
    }
  },
  stop(){ if(this.controller) this.controller.abort(); }
};
window.AIAgent = AIAgent;

/* ============================================================
   MINI MARKDOWN RENDERER — per mostrare correttamente le risposte
   dell'AI (tabelle, elenchi, grassetto/corsivo, codice, titoli)
   invece del testo grezzo con i simboli markdown.
   ============================================================ */
function mdSplitRow(line){
  return line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
}
function mdRenderTables(text){
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  const sepRe = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
  const rowRe = /^\s*\|.*\|\s*$/;
  while(i < lines.length){
    if(rowRe.test(lines[i]) && i+1 < lines.length && sepRe.test(lines[i+1])){
      const headerCells = mdSplitRow(lines[i]);
      i += 2;
      const rows = [];
      while(i < lines.length && rowRe.test(lines[i])){ rows.push(mdSplitRow(lines[i])); i++; }
      let html = '<table style="border-collapse:collapse; width:100%; margin:8px 0; font-size:12.5px;">';
      html += '<thead><tr>' + headerCells.map(c=>`<th style="border:1px solid var(--border); padding:5px 8px; background:var(--surface-2); text-align:left;">${c}</th>`).join('') + '</tr></thead>';
      html += '<tbody>' + rows.map(r=>'<tr>'+r.map(c=>`<td style="border:1px solid var(--border); padding:5px 8px;">${c}</td>`).join('')+'</tr>').join('') + '</tbody></table>';
      out.push(html);
    } else { out.push(lines[i]); i++; }
  }
  return out.join('\n');
}
function mdRenderLists(text){
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while(i < lines.length){
    if(/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\*\*/.test(lines[i])){
      const items = [];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i]) && !/^\s*\*\*/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
      out.push('<ul style="margin:4px 0; padding-left:20px;">' + items.map(it=>`<li>${it}</li>`).join('') + '</ul>');
    } else if(/^\s*\d+\.\s+/.test(lines[i])){
      const items = [];
      while(i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
      out.push('<ol style="margin:4px 0; padding-left:20px;">' + items.map(it=>`<li>${it}</li>`).join('') + '</ol>');
    } else { out.push(lines[i]); i++; }
  }
  return out.join('\n');
}
function renderMarkdown(src){
  if(!src) return '';
  let text = esc(src);
  const codeBlocks = [];
  text = text.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push(`<pre style="background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow-x:auto; font-family:var(--mono); font-size:12px; margin:8px 0;"><code>${code}</code></pre>`);
    return '\u0000CODEBLOCK' + idx + '\u0000';
  });
  text = text.replace(/`([^`\n]+)`/g, '<code style="background:var(--surface-2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:0.92em;">$1</code>');
  text = mdRenderTables(text);
  text = text.replace(/^#### (.*)$/gm,'<h4 style="margin:8px 0 4px; font-size:13px;">$1</h4>');
  text = text.replace(/^### (.*)$/gm,'<h4 style="margin:10px 0 4px; font-size:13.5px;">$1</h4>');
  text = text.replace(/^## (.*)$/gm,'<h3 style="margin:12px 0 4px; font-size:14.5px;">$1</h3>');
  text = text.replace(/^# (.*)$/gm,'<h2 style="margin:14px 0 6px; font-size:15.5px;">$1</h2>');
  text = text.replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>');
  text = text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">$1</a>');
  text = text.replace(/^&gt; ?(.*)$/gm,'<blockquote style="border-left:3px solid var(--border-strong); margin:6px 0; padding:2px 10px; color:var(--text-secondary);">$1</blockquote>');
  text = mdRenderLists(text);
  text = text.split(/\n{2,}/).map(block=>{
    const t = block.trim();
    if(!t) return '';
    if(/<(h2|h3|h4|ul|ol|blockquote|table)/.test(t) || t.includes('\u0000CODEBLOCK')) return t;
    return '<p style="margin:4px 0;">' + t.replace(/\n/g,'<br>') + '</p>';
  }).join('\n');
  text = text.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (m, idx) => codeBlocks[Number(idx)]);
  return text;
}

    root.querySelector('#ai-send-btn').addEventListener('click', () => this.send());
    this.populateModelSelect();
    this.renderMessages();
  },

  async refreshStatus(){
    const dot = document.getElementById('ai-status-dot');
    if(!dot) return;
    dot.className = 'ai-status-dot';
    const r = await OllamaManager.testConnection();
    if(r.ok){ dot.classList.add('on'); dot.title = 'Ollama connesso'; }
    else { dot.classList.add('off'); dot.title = 'Ollama non raggiungibile: ' + r.error; }
  },
  async populateModelSelect(){
    const sel = document.getElementById('ai-model-select');
    if(!sel) return;
    sel.innerHTML = `<option>Caricamento…</option>`;
    const r = await OllamaManager.testConnection();
    if(!r.ok){ sel.innerHTML = `<option value="">Non disponibile</option>`; return; }
    const current = OllamaManager.getModel();
    sel.innerHTML = r.models.map(m=>`<option value="${esc(m)}" ${m===current?'selected':''}>${esc(m)}</option>`).join('') || `<option value="">Nessun modello</option>`;
    if(!current && r.models[0]) OllamaManager.setModel(r.models[0]);
    sel.onchange = () => OllamaManager.setModel(sel.value);
  },

  renderMessages(){
    const el = document.getElementById('ai-messages');
    if(!el) return;
    const wasNearBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
    el.innerHTML = this.currentChat.messages.map((m,idx) => this.renderMsg(m, idx)).join('');
    if(wasNearBottom) el.scrollTop = el.scrollHeight;
    this.bindCitations(el);
    this.bindThinkingToggles(el);
  },
  renderMsg(m, idx){
    if(m.role === 'user') return `<div class="ai-msg user">${esc(m.content)}</div>`;
    if(m.role === 'assistant') return `<div class="ai-msg assistant">${renderMarkdown(m.content)||'<span class=\"muted\">…</span>'}${(m.citations||[]).map(c=>this.renderCitation(c)).join('')}</div>`;
    if(m.role === 'activity') return `<div class="ai-activity">${(m.steps||[]).map(s=>`<div class="ai-activity-step">${s.status==='cancelled'?icon('x',12):s.status==='done'?icon('check',12):icon('clock',12)} ${esc(s.label)}</div>`).join('')}</div>`;
    if(m.role === 'thinking'){
      const open = !m.collapsed;
      return `<div class="ai-thinking">
        <div class="ai-thinking-head" data-thinking-toggle="${idx}">${icon(open?'chevronDown':'chevronRight',12)}<span>Ragionamento del modello</span></div>
        ${open ? `<div class="ai-thinking-body">${esc(m.content)||'<span class=\"muted\">…</span>'}</div>` : ''}
      </div>`;
    }
    return '';
  },
  renderCitation(c){
    return `<span class="ai-citation" data-cite='${esc(JSON.stringify(c))}'>${icon('file',11)} ${esc(c.subjectName||'')}${c.lessonNumber!=null?' · Lezione '+esc(String(c.lessonNumber)):''}${c.fileName?' · '+esc(c.fileName):''}${c.page?' · pag. '+c.page:''}</span>`;
  },
  bindCitations(el){
    el.querySelectorAll('[data-cite]').forEach(elm=>{
      elm.addEventListener('click', () => {
        const c = JSON.parse(elm.dataset.cite);
        if(c.fileName) UniNotesAPI.ui.openFile(c.subjectName, c.lessonId, c.fileName, c.page);
      });
    });
  },
  bindThinkingToggles(el){
    el.querySelectorAll('[data-thinking-toggle]').forEach(elm=>{
      elm.addEventListener('click', () => {
        const idx = Number(elm.dataset.thinkingToggle);
        const m = this.currentChat.messages[idx];
        if(m){ m.collapsed = !m.collapsed; this.renderMessages(); }
      });
    });
  },
  activityLabel(step){
    const l = AI_STEP_LABELS[step.name];
    if(typeof l === 'function') return l(step.args);
    return l || step.name;
  },

  async send(){
    const input = document.getElementById('ai-input');
    if(!input) return;
    const text = input.value.trim();
    if(!text || AIAgent.running) return;
    input.value = '';
    const model = OllamaManager.getModel();
    if(!model){ Toast.error('Seleziona prima un modello Ollama (in alto nel pannello AI o nelle Impostazioni).'); return; }

    this.currentChat.messages.push({ role:'user', content:text });
    this.renderMessages();

    const activityMsg = { role:'activity', steps:[] };
    this.currentChat.messages.push(activityMsg);
    const assistantPlaceholder = { role:'assistant', content:'', citations:[] };
    this.currentChat.messages.push(assistantPlaceholder);
    this.renderMessages();
    let thinkingMsg = null;

    const convoForModel = [
      { role:'system', content: AI_SYSTEM_PROMPT },
      ...this.currentChat.messages
        .filter(m => (m.role==='user' || m.role==='assistant') && m !== assistantPlaceholder)
        .map(m => ({ role:m.role, content:m.content }))
    ];

    const sendBtn = document.getElementById('ai-send-btn');
    if(sendBtn){ sendBtn.innerHTML = icon('stopcircle',15); sendBtn.onclick = () => AIAgent.stop(); }

    try{
      const result = await AIAgent.run(convoForModel, {
        onToken: (tok) => { assistantPlaceholder.content += tok; this.renderMessages(); },
        onThinking: (tok) => {
          if(!thinkingMsg){
            thinkingMsg = { role:'thinking', content:'', collapsed:false };
            const idx = this.currentChat.messages.indexOf(assistantPlaceholder);
            this.currentChat.messages.splice(Math.max(0, idx), 0, thinkingMsg);
          }
          thinkingMsg.content += tok;
          this.renderMessages();
        },
        onStep: (step) => {
          activityMsg.steps.push({ name: step.name, status: step.status || 'running', label: this.activityLabel(step) });
          if(step.result && step.result.ok && step.result.data){
            const arr = Array.isArray(step.result.data) ? step.result.data : [step.result.data];
            arr.forEach(item=>{
              if(item && item.fileName && item.subjectName){
                assistantPlaceholder.citations.push({ subjectName:item.subjectName, lessonId:item.lessonId, lessonNumber:item.lessonNumber, fileName:item.fileName, page:item.page });
              }
            });
          }
          this.renderMessages();
        }
      });
      if(result.aborted){
        assistantPlaceholder.content = assistantPlaceholder.content || 'Generazione interrotta.';
      } else {
        assistantPlaceholder.content = result.finalMessage || assistantPlaceholder.content;
      }
      assistantPlaceholder.citations = (assistantPlaceholder.citations||[]).filter((c,i,arr)=>arr.findIndex(x=>x.fileName===c.fileName && x.lessonId===c.lessonId)===i).slice(0,5);
    }catch(err){
      console.error(err);
      assistantPlaceholder.content = 'Errore: ' + (err.message || err);
    }finally{
      if(thinkingMsg) thinkingMsg.collapsed = true;
      if(sendBtn){ sendBtn.innerHTML = icon('send',15); sendBtn.onclick = () => this.send(); }
      this.currentChat.updatedAt = Date.now();
      if(this.currentChat.title === 'Nuova conversazione' && text) this.currentChat.title = text.slice(0,40);
      ChatHistoryStore.save(this.currentChat).catch(()=>{});
      this.renderMessages();
    }
  },

  async openHistory(){
    const list = await ChatHistoryStore.list();
    const m = ModalManager.open(`
      <div class="modal-header"><div class="modal-title">${icon('clock',16)} Cronologia conversazioni</div><button class="icon-btn" id="m-close">${icon('x',16)}</button></div>
      <div class="modal-body" style="max-height:60vh; overflow:auto;">
        ${list.length ? list.map(c=>`
          <div class="card card-hover" data-open-chat="${c.id}" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; cursor:pointer;">
            <div style="min-width:0;"><div style="font-size:13px; font-weight:650;">${esc(c.title)}</div><div class="muted" style="font-size:11px;">${fmtRelative(new Date(c.updatedAt))}</div></div>
            <button class="icon-btn" data-delete-chat="${c.id}">${icon('trash',14)}</button>
          </div>
        `).join('') : `<div class="muted" style="padding:20px 0; text-align:center;">Nessuna conversazione salvata ancora.</div>`}
      </div>
      <div class="modal-footer"><button class="btn" id="m-ok">Chiudi</button></div>
    `);
    m.querySelector('#m-close').onclick = () => ModalManager.close();
    m.querySelector('#m-ok').onclick = () => ModalManager.close();
    m.querySelectorAll('[data-open-chat]').forEach(elm=>{
      elm.addEventListener('click', () => {
        const chat = list.find(c=>c.id===elm.dataset.openChat);
        if(chat){ this.currentChat = chat; this.renderMessages(); }
        ModalManager.close();
      });
    });
    m.querySelectorAll('[data-delete-chat]').forEach(elm=>{
      elm.addEventListener('click', async (e) => {
        e.stopPropagation();
        await ChatHistoryStore.delete(elm.dataset.deleteChat);
        Toast.success('Conversazione eliminata');
        ModalManager.close();
        this.openHistory();
      });
    });
  }
};
