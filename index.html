});

/* ============================================================
   FILESYSTEM MANAGER — wraps File System Access API
   ============================================================ */
class MobileVirtualFileHandle {
  constructor(name, file, parent, rootKey){
    this.kind = 'file'; this.name = name; this.parent = parent; this.rootKey = rootKey;
    this._file = file || null; this._content = null;
  }
  _storageKey(){ return `uninotes.mobile.meta.${this.rootKey}.${this.parent.path ? this.parent.path + '/' : ''}${this.name}`; }
  async getFile(){
    if(this._content != null){
      return new File([this._content], this.name, { type:this._file?.type || 'application/json', lastModified:Date.now() });
    }
    return this._file || new File([''], this.name, { type:'application/octet-stream' });
  }
  async createWritable(){
    let next = '';
    return {
      write: async (data) => { next = typeof data === 'string' ? data : await new Blob([data]).text(); },
      close: async () => {
        this._content = next;
        try{ localStorage.setItem(this._storageKey(), next); }catch(e){ console.warn('Salvataggio locale mobile fallito', e); }
      }
    };
  }
  async queryPermission(){ return 'granted'; }
  async requestPermission(){ return 'granted'; }
}

class MobileVirtualDirectoryHandle {
  constructor(name, parent=null, rootKey='', path=''){
    this.kind = 'directory'; this.name = name; this.parent = parent; this.rootKey = rootKey; this.path = path;
    this.children = new Map();
  }
  async *entries(){
    const arr = [...this.children.entries()].sort((a,b)=>a[0].localeCompare(b[0],'it',{numeric:true}));
    for(const pair of arr) yield pair;
  }
  async getDirectoryHandle(name, opts={}){
    const current = this.children.get(name);
    if(current?.kind === 'directory') return current;
    if(current) throw new DOMException('Esiste un file con questo nome','TypeMismatchError');
    if(opts.create){
      const path = this.path ? `${this.path}/${name}` : name;
      const dir = new MobileVirtualDirectoryHandle(name, this, this.rootKey, path);
      this.children.set(name, dir); return dir;
    }
    throw new DOMException('Cartella non trovata','NotFoundError');
  }
  async getFileHandle(name, opts={}){
    const current = this.children.get(name);
    if(current?.kind === 'file') return current;
    if(current) throw new DOMException('Esiste una cartella con questo nome','TypeMismatchError');
    if(opts.create){
      const file = new MobileVirtualFileHandle(name, null, this, this.rootKey);
      const stored = localStorage.getItem(file._storageKey());
      if(stored != null) file._content = stored;
      this.children.set(name, file); return file;
    }
    throw new DOMException('File non trovato','NotFoundError');
  }
  async removeEntry(name){ if(!this.children.has(name)) throw new DOMException('Elemento non trovato','NotFoundError'); this.children.delete(name); }
  async queryPermission(){ return 'granted'; }
  async requestPermission(){ return 'granted'; }
}

const MobileFolderBridge = {
  supported(){ return typeof HTMLInputElement !== 'undefined' && 'webkitdirectory' in document.createElement('input'); },
  isMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ''); },
  fingerprintFromDirectories(files){
    const dirs = new Set();
    for(const file of files){
      const path = String(file.webkitRelativePath || file.name);
      const parts = path.split('/');
      for(let i=1;i<parts.length;i++) dirs.add(parts.slice(0,i).join('/'));
    }
    const base = [...dirs].sort().join('|');
    let h = 2166136261;
    for(let i=0;i<base.length;i++){ h ^= base.charCodeAt(i); h = Math.imul(h,16777619); }
    return `${(h>>>0).toString(36)}`;
  },
  buildTree(fileList){
    const files = [...fileList];
    if(!files.length) throw new Error('Nessun file selezionato.');
    const first = String(files[0].webkitRelativePath || files[0].name);
    const rootName = first.includes('/') ? first.split('/')[0] : 'Uni Notes';
    const rootKey = this.fingerprintFromDirectories(files);
    const root = new MobileVirtualDirectoryHandle(rootName, null, rootKey, '');
    for(const file of files){
      const raw = String(file.webkitRelativePath || file.name);
      const parts = raw.includes('/') ? raw.split('/').slice(1) : [raw];
      if(!parts.length) continue;
      let dir = root;
      for(let i=0;i<parts.length-1;i++){
        const name = parts[i];
        let child = dir.children.get(name);
        if(!child){
          const path = dir.path ? `${dir.path}/${name}` : name;
          child = new MobileVirtualDirectoryHandle(name, dir, rootKey, path);
          dir.children.set(name, child);
        }
        dir = child;
      }
      const name = parts[parts.length-1];
      const fh = new MobileVirtualFileHandle(name, file, dir, rootKey);
      const stored = localStorage.getItem(fh._storageKey());
      if(stored != null) fh._content = stored;
      dir.children.set(name, fh);
    }
    return { root, rootName, rootKey, fileCount: files.length };
  }
};

const FileSystemManager = {
  supported(){ return 'showDirectoryPicker' in window; },
  mobileSupported(){ return MobileFolderBridge.supported(); },

  async pickDirectory(){
    if(!this.supported()) throw new Error('unsupported');
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    return handle;
  },

  async verifyPermission(handle, readwrite=true){
    const opts = readwrite ? { mode: 'readwrite' } : {};
    if((await handle.queryPermission(opts)) === 'granted') return true;
    if((await handle.requestPermission(opts)) === 'granted') return true;
    return false;
  },

  async listEntries(dirHandle){
    const entries = [];
    for await (const [name, handle] of dirHandle.entries()){
      if(name.startsWith('.')) continue;
      entries.push({ name, handle, kind: handle.kind });
    }
    entries.sort((a,b)=> a.name.localeCompare(b.name, 'it', {numeric:true}));
    return entries;
  },

  async readTextFile(fileHandle){
    const file = await fileHandle.getFile();
    return await file.text();
  },

  async writeTextFile(fileHandle, text){
    const writable = await fileHandle.createWritable();
    await writable.write(text);
    await writable.close();
  },

  async getFileMeta(fileHandle){
    const file = await fileHandle.getFile();
    return { size: file.size, lastModified: file.lastModified, type: file.type, file };
  },

  async createSubDir(parentHandle, name){
    return await parentHandle.getDirectoryHandle(name, { create: true });
  },

  async getOrCreateFile(dirHandle, name){
    return await dirHandle.getFileHandle(name, { create: true });
  },

  async deleteEntry(dirHandle, name){
    await dirHandle.removeEntry(name, { recursive: true });
  },

  async renameFile(dirHandle, oldName, newName){
    const oldHandle = await dirHandle.getFileHandle(oldName);
    const file = await oldHandle.getFile();
    const content = await file.arrayBuffer();
    const newHandle = await dirHandle.getFileHandle(newName, { create: true });
    const writable = await newHandle.createWritable();
    await writable.write(content);
    await writable.close();
    await dirHandle.removeEntry(oldName);
  },

  async copyFileInto(dirHandle, file, targetName){
    const handle = await dirHandle.getFileHandle(targetName || file.name, { create: true });
    const writable = await handle.createWritable();
    await writable.write(file);
    await writable.close();
    return handle;
  }
};

/* ============================================================
   LIBRARY SCANNER — legge la cartella reale e costruisce l'indice
   ============================================================ */
const KNOWN_FILE_ROLES = {
  registrazione: ['registrazione', 'audio', 'lezione'],
  trascrizione: ['trascrizione', 'transcript'],
  appunti_txt: ['appunti'],
  appunti_tex: [],
  appunti_pdf: []
};
const LESSON_FOLDER_RE = /^Lezione\s*0*(\d+)\s*-\s*(?:(\d{2}-\d{2}-\d{4})(?:\s*[-–]\s*(.+))?|(.+))$/i;

/** Convenzione ufficiale dei nomi delle lezioni: "Lezione X - argomento".
 * Il campo title contiene solo l'argomento; la parte "Lezione X -" viene
 * sempre generata dall'app. Le cartelle storiche restano leggibili per compatibilità.
 */
function lessonDisplayName(lesson){
  const n = Number(lesson?.number);
  const prefix = Number.isFinite(n) && n > 0 ? `Lezione ${n}` : 'Lezione';
  const topic = String(lesson?.title || '').trim().replace(/^Lezione\s*0*\d+\s*[-–:]\s*/i,'').trim();
  return topic ? `${prefix} - ${topic}` : prefix;
}

function requiredLessonTitle(title){
  return String(title || '').trim().replace(/^Lezione\s*0*\d+\s*[-–:]\s*/i,'').trim();
}

function canonicalLessonPdfName(lesson, ext='pdf'){
  const base = lessonDisplayName(lesson);
  const safe = base.replace(/[\\/:*?"<>|]/g,' - ').replace(/\s+/g,' ').trim();
  return `${safe}.${String(ext).replace(/^\./,'').toLowerCase()}`;
}


const RAW_FOLDER_NAME = 'Materiale grezzo';
const CATEGORY_FOLDERS = {
  registrazione: 'Registrazioni',
  trascrizione: 'Trascrizioni',
  appunti: 'Appunti',
  latex: 'LaTeX di lavoro'
};
const CATEGORY_FOLDER_TO_ROLE = Object.fromEntries(Object.entries(CATEGORY_FOLDERS).map(([role,folder])=>[folder.toLowerCase(), role]));
const MAIN_FILE_NAME_HINTS = ['rielaborazione', 'rielaborato', 'finale', 'main'];

const LibraryScanner = {
  async scan(rootHandle){
    const subjects = [];
    const rootEntries = await FileSystemManager.listEntries(rootHandle);
    for(const entry of rootEntries){
      if(entry.kind !== 'directory') continue;
      if(entry.name.toLowerCase() === 'config') continue;
      const subject = await this.scanSubject(entry.name, entry.handle);
      subjects.push(subject);
    }
    subjects.sort((a,b)=> a.name.localeCompare(b.name, 'it'));
    return { subjects };
  },

  async scanSubject(name, handle){
    const entries = await FileSystemManager.listEntries(handle);
    const lessons = [];
    let configMeta = {};
    // .subject.json è nascosto e listEntries() lo esclude: leggilo direttamente
    // così semestre e anno accademico della materia restano davvero persistenti.
    try{
      const metaHandle = await handle.getFileHandle('.subject.json');
      configMeta = JSON.parse(await FileSystemManager.readTextFile(metaHandle));
    }catch(e){}
    const storedSemester = normalizeSemester(configMeta.semester);
    const storedAcademicYear = configMeta.academicYear || '';
    for(const entry of entries){
      if(entry.kind === 'directory'){
        const lesson = await this.scanLesson(entry.name, entry.handle, name, storedSemester, storedAcademicYear);
        if(lesson) lessons.push(lesson);
      }
    }
    lessons.sort((a,b)=> (a.number||0) - (b.number||0));
    const subject = {
      id: 'subj_' + name,
      name,
      handle,
      docente: configMeta.docente || '',
      codice: configMeta.codice || '',
      aula: configMeta.aula || '',
      color: configMeta.color || pickColor(name),
      // Il semestre è un'attribuzione della materia, non uno stato temporaneo.
      // Se manca nei vecchi dati, viene inferito una sola volta dalle lezioni e
      // immediatamente persistito in .subject.json.
      semester: normalizeSemester(configMeta.semester),
      academicYear: configMeta.academicYear || '',
      lessons
    };
    if(!subject.semester){
      subject.semester = inferSubjectSemester(subject.lessons);
      subject._semesterNeedsPersist = true;
    }
    if(!subject.academicYear){
      const datedLesson = subject.lessons.find(l => l.date);
      subject.academicYear = datedLesson ? academicYearForDate(datedLesson.date) : getCurrentSemesterContext().academicYear;
      subject._semesterNeedsPersist = true;
    }
    if(subject._semesterNeedsPersist){
      try{ await persistSubjectMeta(subject); }catch(e){}
      delete subject._semesterNeedsPersist;
    }
    return subject;
  },

  async scanLesson(folderName, handle, subjectName, subjectSemester=null, subjectAcademicYear=''){
    let number = null, date = null, title = '';
    const m = LESSON_FOLDER_RE.exec(folderName);
    if(m){
      number = parseInt(m[1], 10);
      if(m[2]){
        const [dd,mm,yyyy] = m[2].split('-').map(Number);
        date = new Date(yyyy, mm-1, dd);
        title = m[3] || '';
      } else {
        // Nuova convenzione: "Lezione X - argomento". La data viene dal metadato.
        title = m[4] || '';
      }
    } else {
      title = folderName;
    }
    // .lesson.json è un file nascosto e listEntries() lo esclude intenzionalmente.
    // Leggilo direttamente dal handle della lezione, così gli stati cartacei
    // (stampata/evidenziata) e gli altri metadati persistono anche dopo un refresh.
    let metaOverride = {};
    try{
      const metaHandle = await handle.getFileHandle('.lesson.json');
      metaOverride = JSON.parse(await FileSystemManager.readTextFile(metaHandle));
    }catch(e){
      // File non ancora creato: è normale per le lezioni vecchie/prive di metadati.
    }

    const entries = await FileSystemManager.listEntries(handle);
    const files = {};        // materiale grezzo, per ruolo
    const rootFiles = [];    // file sciolti nella root della lezione (candidati a documento principale)
    const subfolders = [];   // sottocartelle DENTRO "Materiale grezzo" — { name, handle, role|null }
    let rawFolderHandle = null;

    for(const e of entries){
      if(e.kind === 'directory'){
        if(e.name.startsWith('.')) continue;
        if(e.name === RAW_FOLDER_NAME){
          rawFolderHandle = e.handle;
          continue; // scansionata sotto, dopo aver visto tutta la root
        }
        // Sottocartella non riconosciuta e non "Materiale grezzo": la trattiamo come materiale grezzo comunque,
        // per compatibilità con librerie create prima di questa struttura.
        const role = CATEGORY_FOLDER_TO_ROLE[e.name.toLowerCase()] || null;
        subfolders.push({ name: e.name, handle: e.handle, role, folderPath: e.name });
        const inner = await FileSystemManager.listEntries(e.handle);
        for(const fe of inner){
          if(fe.kind !== 'file' || fe.name.startsWith('.')) continue;
          const kind = kindOf(fe.name);
          const effectiveRole = role || this.classifyFile(fe.name, kind);
          files[effectiveRole] = files[effectiveRole] || [];
          files[effectiveRole].push({ name: fe.name, handle: fe.handle, kind, folder: e.name });
        }
        continue;
      }
      const kind = kindOf(e.name);
      rootFiles.push({ name: e.name, handle: e.handle, kind, folder: null });
    }

    // Scansiona il contenuto di "Materiale grezzo" (se esiste), con le sue sottocartelle categoria
    if(rawFolderHandle){
      const rawEntries = await FileSystemManager.listEntries(rawFolderHandle);
      for(const e of rawEntries){
        if(e.kind === 'directory'){
          if(e.name.startsWith('.')) continue;
          const role = CATEGORY_FOLDER_TO_ROLE[e.name.toLowerCase()] || null;
          subfolders.push({ name: e.name, handle: e.handle, role, folderPath: RAW_FOLDER_NAME + '/' + e.name });
          const inner = await FileSystemManager.listEntries(e.handle);
          for(const fe of inner){
            if(fe.kind !== 'file' || fe.name.startsWith('.')) continue;
            const kind = kindOf(fe.name);
            const effectiveRole = role || this.classifyFile(fe.name, kind);
            files[effectiveRole] = files[effectiveRole] || [];
            // Il file si trova su disco dentro "Materiale grezzo/<sottocartella>": il percorso
            // relativo deve riportare ENTRAMBI i livelli, non solo il nome della sottocartella,
            // altrimenti la ricostruzione del path assoluto (Apri nel Finder) salta un livello.
            files[effectiveRole].push({ name: fe.name, handle: fe.handle, kind, folder: RAW_FOLDER_NAME + '/' + e.name });
          }
          continue;
        }
        if(e.name.startsWith('.')) continue;
        const kind = kindOf(e.name);
        const role = this.classifyFile(e.name, kind);
        files[role] = files[role] || [];
        files[role].push({ name: e.name, handle: e.handle, kind, folder: RAW_FOLDER_NAME });
      }
    } else {
      // Non esiste ancora "Materiale grezzo": la creeremo al bisogno (vedi getOrCreateCategoryFolder / getRawFolder)
    }

    // Determina il documento principale: preferenza a metaOverride.mainFile, poi euristica sul nome, poi il primo file "sostanzioso" in root
    let mainFile = null;
    if(metaOverride.mainFile){
      mainFile = rootFiles.find(f => f.name === metaOverride.mainFile) || null;
    }
    if(!mainFile){
      mainFile = rootFiles.find(f => MAIN_FILE_NAME_HINTS.some(hint => f.name.toLowerCase().includes(hint))) || null;
    }
    if(!mainFile && rootFiles.length === 1){
      mainFile = rootFiles[0];
    }
    // Tutti gli altri file in root che non sono il documento principale finiscono comunque visibili come "extra in root"
    const otherRootFiles = rootFiles.filter(f => !mainFile || f.name !== mainFile.name);

    // Il semestre della lezione è IMMUTABILE una volta assegnato.
    // Priorità: metadato della lezione -> inferenza dalla data -> semestre della materia.
    // In questo modo modificare il semestre della materia in futuro non sposta
    // retroattivamente le lezioni già archiviate.
    const resolvedAcademicYear = metaOverride.academicYear || (date ? academicYearForDate(date) : subjectAcademicYear || '');
    const resolvedSemester = normalizeSemester(metaOverride.semester) ||
      (date ? semesterForDate(date, resolvedAcademicYear || academicYearForDate(date)) : null) ||
      normalizeSemester(subjectSemester) || null;
    if(!metaOverride.semester || !metaOverride.academicYear){
      try{
        const metaHandle = await FileSystemManager.getOrCreateFile(handle, '.lesson.json');
        const existing = { ...metaOverride, semester: resolvedSemester, academicYear: resolvedAcademicYear };
        await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
      }catch(e){ console.warn('Salvataggio semestre lezione fallito', e); }
    }

    return {
      id: 'lesson_' + subjectName + '_' + folderName,
      folderName,
      handle,
      subjectName,
      number: metaOverride.number ?? number,
      date: metaOverride.date ? new Date(metaOverride.date) : date,
      title: metaOverride.title || title,
      docente: metaOverride.docente || '',
      tags: metaOverride.tags || [],
      notes: metaOverride.notes || '',
      semester: resolvedSemester,
      academicYear: resolvedAcademicYear,
      createdAt: metaOverride.createdAt || null,
      pinned: !!metaOverride.pinned,
      highlightedOnPaper: !!metaOverride.highlightedOnPaper,
      printed: !!metaOverride.printed,
      order: metaOverride.order ?? null,
      mainFilePages: (mainFile && metaOverride.mainFilePagesFor === mainFile.name) ? (metaOverride.mainFilePages ?? null) : null,
      files,
      subfolders,
      mainFile,
      otherRootFiles,
      rawFolderHandle
    };
  },

  classifyFile(name, kind){
    const lower = name.toLowerCase();
    if(extOf(name) === 'docx') return 'docx';
    if(kind === 'audio') return 'registrazione';
    if(kind === 'pdf') return 'pdf';
    if(lower.includes('trascriz') || lower.includes('transcript')) return 'trascrizione';
    if(extOf(name) === 'tex') return 'latex';
    if(lower.includes('appunti') && kind==='text') return 'appunti';
    if(kind === 'text') return 'testo';
    return 'altro';
  },

  /** Restituisce (creandola se necessario) la cartella "Materiale grezzo" dentro la lezione */
  async getRawFolder(lesson){
    if(lesson.rawFolderHandle) return lesson.rawFolderHandle;
    const handle = await FileSystemManager.createSubDir(lesson.handle, RAW_FOLDER_NAME);
    lesson.rawFolderHandle = handle;
    return handle;
  },

  /** Restituisce (creandola se necessario) la cartella categoria per un ruolo, dentro "Materiale grezzo" */
  async getOrCreateCategoryFolder(lesson, role){
    const folderName = CATEGORY_FOLDERS[role];
    const raw = await this.getRawFolder(lesson);
    if(!folderName) return raw; // ruoli senza cartella dedicata restano nella root del materiale grezzo
    let sub = lesson.subfolders.find(sf => sf.name === folderName);
    if(sub) return sub.handle;
    const handle = await FileSystemManager.createSubDir(raw, folderName);
    lesson.subfolders.push({ name: folderName, handle, role, folderPath: RAW_FOLDER_NAME + '/' + folderName });
    return handle;
  },

  /** Imposta un file esistente della root come documento principale della lezione */
  async setMainFile(lesson, file){
    const originalName = file.name;
    // Per il documento principale PDF applichiamo sempre la convenzione
    // "Lezione X - argomento.pdf". Non modifichiamo altri file.
    if(file.kind === 'pdf'){
      const desiredName = canonicalLessonPdfName(lesson, 'pdf');
      if(file.name !== desiredName){
        const oldName = file.name;
        // Evita di sovrascrivere accidentalmente un PDF già esistente con il nome canonico.
        try{
          await lesson.handle.getFileHandle(desiredName);
          throw new Error(`Esiste già il PDF "${desiredName}" nella cartella della lezione.`);
        }catch(checkErr){
          if(checkErr && checkErr.message && checkErr.message.startsWith('Esiste già il PDF')) throw checkErr;
          await FileSystemManager.renameFile(lesson.handle, oldName, desiredName);
          file = { ...file, name: desiredName, handle: await lesson.handle.getFileHandle(desiredName) };
        }
      }
    }
    lesson.mainFile = file;
    lesson.mainFilePages = null;
    lesson.otherRootFiles = (lesson.otherRootFiles||[]).filter(f => f.name !== originalName && f.name !== file.name);
    const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing.mainFile = file.name;
    delete existing.mainFilePages;
    delete existing.mainFilePagesFor;
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
    // Se è un PDF, calcola subito il numero di pagine e mettilo in cache per le statistiche del corso.
    if(file.kind === 'pdf'){
      try{ await this.cacheMainFilePages(lesson, file); }catch(e){ console.warn('Conteggio pagine fallito', e); }
    }
  },

  /**
   * Calcola il numero di pagine del PDF e lo mette in cache in .lesson.json.
   * Il conteggio è completamente offline: prima usa PDF.js se già disponibile,
   * poi analizza direttamente il PDF, incluse le pagine contenute negli Object Stream.
   */
  async cacheMainFilePages(lesson, file){
    file = file || lesson.mainFile;
    if(!file || file.kind !== 'pdf') return null;
    const fileObj = await file.handle.getFile();
    const buf = await fileObj.arrayBuffer();
    let numPages = null;

    // Fast path: PDF.js già caricato (ad esempio dopo aver aperto un PDF).
    if(window.pdfjsLib){
      try{
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        numPages = Number(pdf.numPages) || null;
      }catch(e){
        console.warn('PDF.js non ha potuto leggere il PDF, uso il parser offline.', e);
      }
    }

    // Parser PDF locale robusto: supporta oggetti normali e Object Stream compressi.
    if(!(numPages > 0)){
      numPages = await countPdfPagesFallback(buf);
    }
    if(!(numPages > 0)){
      throw new Error('Numero pagine PDF non determinabile');
    }

    lesson.mainFilePages = numPages;
    const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing.mainFilePages = numPages;
    existing.mainFilePagesFor = file.name;
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
    return numPages;
  },

  /** Attiva/disattiva il "preferito" di una lezione, persistendolo in .lesson.json */
  async togglePinned(lesson){
    lesson.pinned = !lesson.pinned;
    const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing.pinned = lesson.pinned;
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
    return lesson.pinned;
  },

  /** Segna/desegnal una lezione come già evidenziata/stampata sui fogli cartacei. */
  async togglePaperStatus(lesson, key){
    const allowed = ['highlightedOnPaper', 'printed'];
    if(!allowed.includes(key)) throw new Error('Stato lezione non valido');
    lesson[key] = !lesson[key];
    const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing[key] = !!lesson[key];
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
    return lesson[key];
  },

  /** Salva l'ordine manuale (drag & drop) di una lezione dentro la sua materia. */
  async saveOrder(lesson, order){
    lesson.order = order;
    const metaHandle = await FileSystemManager.getOrCreateFile(lesson.handle, '.lesson.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing.order = order;
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
  }
};


function pickColor(seed){
  const palette = ['#3457D5','#1E8E5A','#B7791F','#C4361F','#7C3AED','#0E7C86','#B23A72','#3A7CA5'];
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}

/* ============================================================
   LESSON STATUS — calcolato SOLO dai file realmente presenti
   Per le nuove lezioni è obbligatorio anche un .tex nel Materiale grezzo.
   ============================================================ */
const REQUIRED_STEPS = [
  { key: 'registrazione', label: 'Registrazione', icon: 'mic' },
  { key: 'trascrizione', label: 'Trascrizione', icon: 'transcript' },
  { key: 'appunti', label: 'Appunti', icon: 'notes' },
  { key: 'mainFile', label: 'Documento finale', icon: 'pdf' }
];
// Da questa build in poi, le nuove lezioni richiedono anche almeno un file .tex
// nel materiale grezzo. Le lezioni già presenti non hanno un createdAt e restano
// volutamente esenti, così l'introduzione del requisito non modifica lo storico.
const LATEX_REQUIREMENT_CUTOFF = Date.parse('2026-10-02T16:05:00+02:00');
function lessonCreationTime(lesson){
  const raw = lesson?.createdAt ?? null;
  const ts = raw ? Date.parse(raw) : NaN;
  return Number.isFinite(ts) ? ts : null;
}
function lessonNeedsLatex(lesson){
  const ts = lessonCreationTime(lesson);
  return ts !== null && ts >= LATEX_REQUIREMENT_CUTOFF;
}
function lessonHasLatex(lesson){
  return !!(lesson?.files?.latex && lesson.files.latex.length > 0);
}
function lessonStepDone(lesson, key){
  if(key === 'mainFile') return !!lesson.mainFile;
  if(key === 'latex') return lessonHasLatex(lesson);
  return !!(lesson.files[key] && lesson.files[key].length > 0);
}
function lessonRequiredSteps(lesson){
  return lessonNeedsLatex(lesson)
    ? [...REQUIRED_STEPS, { key: 'latex', label: 'File .tex', icon: 'latex' }]
    : REQUIRED_STEPS;
}
function lessonStatus(lesson){
  const has = k => lessonStepDone(lesson, k);
  // Per le nuove lezioni il .tex è obbligatorio nel materiale grezzo.
  // La mancanza del .tex rende la lezione incompleta anche quando esiste il PDF.
  if(lessonNeedsLatex(lesson) && !has('latex')) return 'missing';
  if(has('mainFile')) return 'complete';
  if(has('registrazione') || has('trascrizione') || has('appunti') || has('latex')) return 'progress';
  return 'missing';
}
function lessonStatusMeta(status){
  const map = {
    complete: { label: 'Completa', cls: 'status-complete', icon: 'checkCircle' },
    progress: { label: 'In lavorazione', cls: 'status-progress', icon: 'clock' },
    missing:  { label: 'Materiale incompleto', cls: 'status-missing', icon: 'alert' },
    ready:    { label: 'Pronta', cls: 'status-ready', icon: 'bolt' }
  };
  return map[status] || map.missing;
}
function subjectStats(subject){
  const total = subject.lessons.length;
  let complete = 0, progress = 0, missing = 0, totalPages = 0, pagesKnownFor = 0;
  subject.lessons.forEach(l => {
    const s = lessonStatus(l);
    if(s==='complete') complete++; else if(s==='progress') progress++; else missing++;
    // Pagine totali del corso: contate SOLO sui documenti principali (PDF) di ogni lezione.
    if(l.mainFile && l.mainFile.kind === 'pdf' && typeof l.mainFilePages === 'number'){
      totalPages += l.mainFilePages;
      pagesKnownFor++;
    }
  });
  const pct = total ? Math.round((complete/total)*100) : 0;
  const mainPdfCount = subject.lessons.filter(l => l.mainFile && l.mainFile.kind === 'pdf').length;
  return { total, complete, progress, missing, pct, totalPages, pagesKnownFor, mainPdfCount };
}
function libraryTotals(){
  let totalLessons=0, complete=0, progress=0, missing=0;
  AppState.library.subjects.forEach(s => {
    s.lessons.forEach(l => {
      totalLessons++;
      const st = lessonStatus(l);
      if(st==='complete') complete++; else if(st==='progress') progress++; else missing++;
    });
  });
  return { subjects: AppState.library.subjects.length, totalLessons, complete, progress, missing };
}
function findSubject(name){ return AppState.library.subjects.find(s => s.name === name); }
function findLesson(subjectName, lessonId){
  const s = findSubject(subjectName);
  if(!s) return null;
  return s.lessons.find(l => l.id === lessonId);
}
function allLessonsFlat(){
  const out = [];
  AppState.library.subjects.forEach(s => s.lessons.forEach(l => out.push(l)));
  return out;
}

function plural(n, one, many){ return n === 1 ? one : many; }
/**
 * Conteggio pagine PDF offline per le statistiche.
 * Supporta oggetti PDF normali, page tree con /Count e Object Stream compressi.
 */
async function countPdfPagesFallback(arrayBuffer){
  try{
    const bytes = new Uint8Array(arrayBuffer);
    if(bytes.length < 8) return null;

    const text = bytesToLatin1(bytes);
    if(!/^%PDF-/.test(text)) return null;

    // 1) PDF classici: le Page sono oggetti indiretti normali.
    const directPages = uniquePageObjectCount(text);
    if(directPages > 0) return directPages;

    // 2) PDF moderni: page tree e Page possono vivere dentro Object Stream.
    const objectMatches = [...text.matchAll(/(\d+)\s+(\d+)\s+obj\b/g)];
    let bestCount = 0;
    const objectStreams = [];

    for(let i=0; i<objectMatches.length; i++){
      const m = objectMatches[i];
      const start = m.index;
      const end = i + 1 < objectMatches.length ? objectMatches[i+1].index : text.length;
      const objText = text.slice(start, end);
      const counts = [...objText.matchAll(/\/Type\s*\/Pages\b[\s\S]{0,1800}?\/Count\s+(\d+)/g)]
        .map(x => Number(x[1]))
        .filter(n => Number.isFinite(n) && n > 0);
      if(counts.length) bestCount = Math.max(bestCount, ...counts);
      if(/\/Type\s*\/ObjStm\b/.test(objText)) objectStreams.push({ start, end, objText });
    }

    const decodedStreams = [];
    for(const os of objectStreams){
      try{
        const decoded = await decodePdfObjectStream(bytes, os.start, os.end, os.objText);
        if(!decoded) continue;
        const decodedText = bytesToLatin1(decoded);
        const pageCount = (decodedText.match(/\/Type\s*\/Page(?:\b|[\s\/>])/g) || []).length;
        if(pageCount > 0) decodedStreams.push({ pageCount, text: decodedText });

        const streamCounts = [...decodedText.matchAll(/\/Type\s*\/Pages\b[\s\S]{0,1800}?\/Count\s+(\d+)/g)]
          .map(x => Number(x[1]))
          .filter(n => Number.isFinite(n) && n > 0);
        if(streamCounts.length) bestCount = Math.max(bestCount, ...streamCounts);
      }catch(e){
        console.warn('Object Stream PDF non decodificabile', e);
      }
    }

    // 3) Somma le Page trovate negli stream decodificati.
    const objectStreamPages = decodedStreams.reduce((sum, x) => sum + x.pageCount, 0);
    if(objectStreamPages > 0) return objectStreamPages;

    // 4) Ultimo fallback: /Count nel page tree. Il valore massimo è normalmente il totale.
    return bestCount || null;
  }catch(e){
    console.warn('Conteggio PDF offline fallito', e);
    return null;
  }
}

function bytesToLatin1(bytes){
  try{ return new TextDecoder('latin1').decode(bytes); }
  catch(e){
    let out='';
    const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk){
      out += String.fromCharCode(...bytes.subarray(i, Math.min(bytes.length, i+chunk)));
    }
    return out;
  }
}

function uniquePageObjectCount(text){
  const ids = new Set();
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while((m=re.exec(text))){
    const start=m.index;
    const end=text.indexOf('endobj', start);
    const obj=text.slice(start, end>start?end:Math.min(text.length,start+120000));
    if(/\/Type\s*\/Page(?:\b|[\s\/>])/.test(obj)) ids.add(`${m[1]} ${m[2]}`);
  }
  return ids.size || (text.match(/\/Type\s*\/Page(?:\b|[\s\/>])/g)||[]).length;
}

async function decodePdfObjectStream(allBytes, objStart, objEnd, objText){
  if(!/\/Type\s*\/ObjStm\b/.test(objText)) return null;
  const filters = objText.match(/\/Filter\s*(?:\[([^\]]+)\]|(\/\w+))/);
  const filterText = filters ? (filters[1] || filters[2] || '') : '';
  if(filterText && !/\/FlateDecode\b/.test(filterText)) return null;

  const firstMatch = /\/First\s+(\d+)/.exec(objText);
  if(!firstMatch) return null;

  let dataStart = objText.indexOf('stream');
  if(dataStart < 0) return null;
  dataStart += 6;

  if(allBytes[objStart + dataStart] === 13 && allBytes[objStart + dataStart + 1] === 10) dataStart += 2;
  else if(allBytes[objStart + dataStart] === 10 || allBytes[objStart + dataStart] === 13) dataStart += 1;

  const lengthMatch = /\/Length\s+(\d+)/.exec(objText);
  let length = lengthMatch ? Number(lengthMatch[1]) : null;
  if(!(length > 0)){
    const endStreamRel = objText.indexOf('endstream', dataStart);
    if(endStreamRel < 0) return null;
    length = endStreamRel - dataStart;
  }

  const absoluteStart = objStart + dataStart;
  const compressed = allBytes.slice(absoluteStart, absoluteStart + length);
  if(filterText){
    return await inflatePdfBytes(compressed);
  }
  return compressed;
}

async function inflatePdfBytes(bytes){
  if(typeof DecompressionStream !== 'function') return null;
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function lessonPageCount(lesson){
  return (lesson && lesson.mainFile && lesson.mainFile.kind === 'pdf' && typeof lesson.mainFilePages === 'number' && isFinite(lesson.mainFilePages)) ? lesson.mainFilePages : null;
}
function getCanonicalPrintPrice(){
  const raw = localStorage.getItem('uninotes.print.price');
  const n = AppState.normalizePrintPrice(raw, null);
  return n == null ? AppState.getLivePrintSettings().facePrice : n;
}
function getCanonicalPrintPriceCents(){
  return Math.round(getCanonicalPrintPrice() * 100);
}
function getCanonicalDuplex(){
  return localStorage.getItem('uninotes.print.duplex') === '1';
}

function calculatePrintCost(pages, settingsOverride=null){
  const p = Number.isFinite(Number(pages)) ? Math.max(0, Math.round(Number(pages))) : null;
  if(p == null) return null;
  const settings = settingsOverride || PrintCostEngine.getSettings();
  const facePrice = Math.max(0, Number(settings.facePrice));
  const paperPrice = Math.max(0, Number(settings.paperPrice ?? 0.01));
  const duplex = !!settings.duplex;
  const sheets = duplex ? Math.ceil(p / 2) : p;
  const faceCost = p * facePrice;
  const paperCost = sheets * paperPrice;
  const totalCost = faceCost + paperCost;
  return { pages:p, sheets, facePrice, paperPrice, faceCost, paperCost, totalCost,
    facePriceCents: facePrice * 100, paperPriceCents: paperPrice * 100,
    faceCostCents: faceCost * 100, paperCostCents: paperCost * 100, totalCostCents: totalCost * 100 };
}

const PrintCostEngine = {
  getSettings(){
    const price = getCanonicalPrintPrice();
    const duplex = getCanonicalDuplex();
    return { facePrice:price, facePriceRaw:AppState.formatStoredPrintPrice(price), facePriceCents:price*100, duplex, paperPriceCents:1, paperPrice:0.01 };
  },
  lesson(lesson, settingsOverride=null){
    const pages = lessonPageCount(lesson);
    const printed = !!lesson && (lesson.printed === true || lesson.printed === 'true' || lesson.printed === 1);
    if(!printed) return { printed:false, known:pages != null, pages, sheets:0, faceCost:0, paperCost:0, totalCost:0, faceCostCents:0, paperCostCents:0, totalCostCents:0 };
    if(pages == null) return { printed:true, known:false, pages:null, sheets:null, faceCost:null, paperCost:null, totalCost:null, faceCostCents:null, paperCostCents:null, totalCostCents:null };
    return { printed:true, known:true, ...calculatePrintCost(pages, settingsOverride) };
  },
  total(lessons, settingsOverride=null){
    let printed=0, knownPrinted=0, missing=0, pages=0, sheets=0, faceCost=0, paperCost=0, totalCost=0;
    for(const lesson of (lessons||[])){
      const result = this.lesson(lesson, settingsOverride);
      if(!result.printed) continue;
      printed++;
      if(!result.known){ missing++; continue; }
      knownPrinted++; pages += result.pages; sheets += result.sheets; faceCost += result.faceCost; paperCost += result.paperCost; totalCost += result.totalCost;
    }
    const settings = settingsOverride ? { ...settingsOverride } : this.getSettings();
    return { settings, printed, knownPrinted, missing, pages, sheets, faceCost, paperCost, totalCost,
      printingFaceCost:faceCost, paperCost, totalPrintCost:totalCost, totalCost,
      printingFaceCostCents:faceCost*100, paperCostCents:paperCost*100, totalPrintCostCents:totalCost*100,
      faceCost, paperCost };
  }
};

function printingForLesson(lesson){ return PrintCostEngine.lesson(lesson); }
function fileKindLabel(kind){
  const map = { audio:'Audio', pdf:'PDF', docx:'Word', text:'Testo', code:'Codice', other:'Altro' };
  return map[kind] || kind || 'Altro';
}
function lessonFileEntries(lesson){
  const byName = new Map();
  Object.values(lesson.files || {}).flat().forEach(f => { if(f && f.name) byName.set(f.folder ? f.folder+'/'+f.name : f.name, f); });
  (lesson.otherRootFiles || []).forEach(f => { if(f && f.name) byName.set('root/'+f.name, f); });
  if(lesson.mainFile && lesson.mainFile.name) byName.set('main/'+lesson.mainFile.name, lesson.mainFile);
  return [...byName.values()];
}
function statisticsForLessons(lessons){
  const rows = lessons || [];
  const livePrintSettings = PrintCostEngine.getSettings();
  AppState.printSettings = livePrintSettings;
  const st = {
    lessons: rows.length, complete:0, progress:0, missing:0, highlighted:0, printed:0,
    files:0, pdfFiles:0, audioFiles:0, docxFiles:0, textFiles:0, codeFiles:0, otherFiles:0,
    pages:0, pagesKnownFor:0, printedPages:0, printedLessonsWithKnownPages:0,
    sheets:0, sheetsKnownFor:0, printingFaceCost:0, paperCost:0, totalPrintCost:0,
    estimatedCostMissingPages:0, sizeBytes:0, filesByKind:{}, lessonsBySubject:{}
  };
  rows.forEach(l => {
    const status = lessonStatus(l);
    if(status==='complete') st.complete++; else if(status==='progress') st.progress++; else st.missing++;
    if(l.highlightedOnPaper) st.highlighted++;
    const files = lessonFileEntries(l);
    st.files += files.length;
    files.forEach(f => {
      const k = f.kind || 'other';
      st.filesByKind[k] = (st.filesByKind[k]||0) + 1;
      if(k==='pdf') st.pdfFiles++; else if(k==='audio') st.audioFiles++; else if(k==='docx') st.docxFiles++; else if(k==='text') st.textFiles++; else if(k==='code') st.codeFiles++; else st.otherFiles++;
    });
    const pages = lessonPageCount(l);
    if(pages != null){ st.pages += pages; st.pagesKnownFor++; }
    const p = printingForLesson(l);
    if(l.printed){
      st.printed++;
      if(p.known){
        st.printedLessonsWithKnownPages++;
        st.printedPages += p.pages;
        st.sheets += p.sheets;
        st.sheetsKnownFor++;
        st.printingFaceCost += p.faceCost;
        st.paperCost += p.paperCost;
        st.totalPrintCost += p.totalCost;
      } else {
        st.estimatedCostMissingPages++;
      }
    }
    const subject = l.subjectName || 'Senza materia';
    st.lessonsBySubject[subject] = (st.lessonsBySubject[subject]||0) + 1;
  });
  st.completePct = st.lessons ? Math.round(st.complete / st.lessons * 100) : 0;
  st.printedPct = st.lessons ? Math.round(st.printed / st.lessons * 100) : 0;
  st.highlightedPct = st.lessons ? Math.round(st.highlighted / st.lessons * 100) : 0;
  st.fileAvg = st.lessons ? st.files / st.lessons : 0;
  st.avgPagesPerLesson = st.pagesKnownFor ? st.pages / st.pagesKnownFor : 0;
  st.avgPrintCost = st.printedLessonsWithKnownPages ? st.totalPrintCost / st.printedLessonsWithKnownPages : 0;
  st.simplexSheetsEquivalent = st.printedPages;
  st.sheetsSavedByDuplex = livePrintSettings.duplex ? Math.max(0, st.simplexSheetsEquivalent - st.sheets) : 0;
  st.sheetsKnown = st.sheetsKnownFor === st.printed;
  st.pagesKnown = st.pagesKnownFor === rows.length;
  return st;
}
function statisticsForLesson(lesson){
  return statisticsForLessons(lesson ? [lesson] : []);
}
function statisticsForSubject(subject){
  return statisticsForLessons(subject ? subject.lessons : []);
}

function clamp01(n){ return Math.max(0, Math.min(1, Number(n) || 0)); }
function addDaysLocal(date, days){ const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); d.setDate(d.getDate()+days); return d; }
function diffDaysLocal(a,b){ return Math.max(0, Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate()).getTime()-new Date(a.getFullYear(),a.getMonth(),a.getDate()).getTime())/86400000)); }
function semesterPrintForecastForSubject(subject, asOf=new Date()){
  if(!subject) return null;
  ensureSubjectSemester(subject);
  const ctx = getCurrentSemesterContext(asOf);
  if(subject.academicYear !== ctx.academicYear || subject.semester !== ctx.semester) return null;

  const range = ctx.range;
  const start = parseISODateLocal(range.start);
  const end = parseISODateLocal(range.teachingEnd);
  const todayRaw = asOf instanceof Date ? asOf : new Date(asOf);
  const today = new Date(todayRaw.getFullYear(), todayRaw.getMonth(), todayRaw.getDate());
  const totalDays = Math.max(1, diffDaysLocal(start,end));
  const elapsedDays = clamp01(diffDaysLocal(start, today) / totalDays) * totalDays;
  const progress = clamp01(elapsedDays / totalDays);

  const lessons = (subject.lessons || []).filter(l=>{
    const d=parseISODateLocal(l?.date);
    return d && d >= start && d <= end && d <= today;
  });
  const knownPageLessons = lessons.filter(l=>lessonPageCount(l)!=null);
  const knownPages = knownPageLessons.reduce((sum,l)=>sum + lessonPageCount(l),0);
  const averagePages = knownPageLessons.length ? knownPages / knownPageLessons.length : 0;
  const currentSettings = PrintCostEngine.getSettings();
  const knownSheetLessons = knownPageLessons.map(l=>calculatePrintCost(lessonPageCount(l), currentSettings)?.sheets).filter(Number.isFinite);
  const knownSheets = knownSheetLessons.reduce((sum,n)=>sum+n,0);
  const averageSheets = knownSheetLessons.length ? knownSheets / knownSheetLessons.length : 0;
  const unknownCurrent = Math.max(0, lessons.length-knownPageLessons.length);

  if(!lessons.length || !knownPageLessons.length || progress <= 0){
    return {available:false, reason:!lessons.length?'no-lessons':!knownPageLessons.length?'no-pages':'too-early', subject, ctx, progress, teachingEnd:end, observedLessons:lessons.length, knownPageLessons:knownPageLessons.length};
  }

  const remainingDays = Math.max(0, totalDays-elapsedDays);
  const elapsedWeeks = Math.max(1/7, elapsedDays/7);
  const lessonsPerWeek = lessons.length / elapsedWeeks;
  const projectedRemainingLessons = Math.max(0, Math.ceil(lessonsPerWeek * (remainingDays/7)));
  const projectedTotalLessons = lessons.length + projectedRemainingLessons;
  const pagesStillUnknown = unknownCurrent + projectedRemainingLessons;
  const projectedTotalPages = knownPages + averagePages * pagesStillUnknown;
  const projectedTotalSheets = knownSheets + averageSheets * pagesStillUnknown;
  const projectedCost = projectedTotalPages * currentSettings.facePrice + projectedTotalSheets * currentSettings.paperPrice;
  const actual = statisticsForSubject(subject);
  const currentSpent = actual.totalPrintCost || 0;
  const remainingPotentialCost = Math.max(0, projectedCost-currentSpent);
  const confidence = lessons.length >= 6 ? 'Buona base' : lessons.length >= 3 ? 'Base iniziale' : 'Stima preliminare';

  return {
    available:true, subject, ctx, teachingEnd:end, progress,
    observedLessons:lessons.length, projectedRemainingLessons, projectedTotalLessons,
    knownPageLessons:knownPageLessons.length, averagePages, projectedTotalPages,
    knownSheets, averageSheets, projectedTotalSheets,
    currentSpent, projectedCost, remainingPotentialCost, confidence,
    pricePerFace:currentSettings.facePrice, duplex:currentSettings.duplex,
    unknownCurrent, remainingDays
  };
}
function semesterPrintForecastForCurrentSubjects(subjects, asOf=new Date()){
  return (subjects || []).map(s=>semesterPrintForecastForSubject(s,asOf)).filter(Boolean);
}

async function ensureStatsPageCounts(lessons, onChange){
  const targets = (lessons||[]).filter(l => l.mainFile && l.mainFile.kind === 'pdf' && typeof l.mainFilePages !== 'number');
  if(!targets.length) return;
  let changed = false;
  window.UniNotesPageCountBusy = true;
  try{
    // Un PDF alla volta: evita che le statistiche aprano decine di documenti PDF.js
    // contemporaneamente mentre l'AI o il lettore stanno lavorando.
    for(const l of targets){
      while(window.UniNotesAIBackground && window.UniNotesAIBackground.running){
        await new Promise(r=>setTimeout(r,750));
      }
      try{
        await LibraryScanner.cacheMainFilePages(l);
        changed = true;
        if(typeof onChange === 'function') onChange();
      }catch(e){ console.warn('Statistiche: conteggio pagine fallito', l.title || l.folderName, e); }
      await new Promise(r=>setTimeout(r,60));
    }
  }finally{
    window.UniNotesPageCountBusy = false;
  }
  if(changed && typeof onChange === 'function') onChange();
}

/* ============================================================
   SETTINGS MANAGER — persistenza leggera (IndexedDB per handle, localStorage per prefs)
   ============================================================ */
const SettingsManager = {
  dbPromise: null,
  db(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('uninotes-db', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return this.dbPromise;
  },
  async rememberFolder(handle){
    try{
      const db = await this.db();
      await new Promise((res, rej) => {
        const tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').put(handle, 'root');
        tx.oncomplete = res; tx.onerror = rej;
      });
    }catch(e){ console.warn('Impossibile salvare handle cartella', e); }
  },
  async recallFolder(){
    try{
      const db = await this.db();
      return await new Promise((res, rej) => {
        const tx = db.transaction('handles','readonly');
        const req = tx.objectStore('handles').get('root');
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => rej(req.error);
      });
    }catch(e){ return null; }
  },
  async rememberMobileFolder(name, rootKey=''){
    localStorage.setItem('uninotes.mobileFolderName', name || 'Cartella');
    localStorage.setItem('uninotes.mobileFolderKey', rootKey || '');
  },
  recallMobileFolder(){
    const name = localStorage.getItem('uninotes.mobileFolderName');
    return name ? { name, rootKey: localStorage.getItem('uninotes.mobileFolderKey') || '' } : null;
  },
  async forgetFolder(){
    try{
      const db = await this.db();
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete('root');
    }catch(e){}
    localStorage.removeItem('uninotes.mobileFolderName');
    localStorage.removeItem('uninotes.mobileFolderKey');
  }
};

/* ============================================================
   FINDER BRIDGE — "Apri nel Finder" via Comandi Rapidi + AppleScript
   ------------------------------------------------------------
   NOTA ARCHITETTURALE: la libreria è gestita tramite la File System
   Access API del browser (FileSystemDirectoryHandle/FileSystemFileHandle),
   che per motivi di sicurezza NON espone mai il percorso POSIX assoluto
   reale del file su disco. Per questo motivo l'utente deve impostare una
   sola volta, in Impostazioni, il percorso assoluto reale della cartella
   collegata (AppState.rootAbsolutePath): da lì ricostruiamo il percorso
   completo del singolo file combinandolo con la gerarchia già nota
   (materia → lezione → eventuale sottocartella → nome file).
   ============================================================ */
const FINDER_SHORTCUT_NAME = "Apri in Finder";

function openLocalFileInFinder(filePath){
  if(typeof filePath !== "string" || !filePath.trim()){
    console.error("[FinderBridge] Percorso file non valido:", filePath);
    return false;
  }

  const cleanPath = filePath.trim();

  const url =
    "shortcuts://run-shortcut" +
    "?name=" + encodeURIComponent(FINDER_SHORTCUT_NAME) +
    "&input=text" +
    "&text=" + encodeURIComponent(cleanPath);

  window.location.href = url;
  return true;
}

const FinderBridge = {
  /**
   * Ricostruisce il percorso POSIX assoluto reale di un file della libreria,
   * combinando il percorso radice configurato dall'utente con la gerarchia
   * materia/lezione/sottocartella già presente nel modello dati in memoria.
   * Non contiene mai path hardcoded: tutto deriva da AppState e dagli oggetti
   * lesson/file passati.
   */
  resolveAbsolutePath(lesson, file){
    const root = (AppState.rootAbsolutePath || '').trim().replace(/\/+$/, '');
    if(!root) return null;
    if(!lesson || !file || !file.name) return null;
    const parts = [root, lesson.subjectName, lesson.folderName];
    if(file.folder) parts.push(file.folder);
    parts.push(file.name);
    return parts.map(p => String(p)).join('/');
  },

  /** Azione principale invocata dai pulsanti "Apri nel Finder" della UI. */
  openFileInFinder(lesson, file){
    const path = this.resolveAbsolutePath(lesson, file);
    if(!path){
      Toast.error('Imposta prima il percorso assoluto della cartella in Impostazioni.');
      Router.go('settings');
      return;
    }
    try{
      const ok = openLocalFileInFinder(path);
      if(!ok) Toast.error('Percorso file non valido.');
    }catch(err){
      console.error('[FinderBridge] Impossibile aprire Finder:', err);
      Toast.error('Impossibile aprire Finder. Verifica di aver installato il Comando Rapido "Apri in Finder" e di consentire l\'apertura di Comandi Rapidi dal browser.');
    }
  },

  /** Rivela l'intera cartella della lezione in Finder (senza selezionare un file preciso). */
  openLessonFolderInFinder(lesson){
    const root = (AppState.rootAbsolutePath || '').trim().replace(/\/+$/, '');
    if(!root || !lesson){
      Toast.error('Imposta prima il percorso assoluto della cartella in Impostazioni.');
      Router.go('settings');
      return;
    }
    const path = [root, lesson.subjectName, lesson.folderName].join('/');
    try{
      const ok = openLocalFileInFinder(path);
      if(!ok) Toast.error('Percorso non valido.');
    }catch(err){
      console.error('[FinderBridge] Impossibile aprire Finder:', err);
      Toast.error('Impossibile aprire Finder. Verifica il Comando Rapido "Apri in Finder".');
    }
  },

  /** Copia negli appunti il percorso assoluto ricostruito di un file, senza passare da Finder. */
  copyFilePath(lesson, file){
    const path = this.resolveAbsolutePath(lesson, file);
    if(!path){
      Toast.error('Imposta prima il percorso assoluto della cartella in Impostazioni.');
      Router.go('settings');
      return;
    }
    Clipboard.copy(path);

const ThemeMenu = {
  toggle(anchor){
    const existing = document.getElementById('theme-menu-pop');
    if(existing){ existing.remove(); return; }
    const rect = anchor.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.id = 'theme-menu-pop';
    pop.style.cssText = `position:fixed; top:${rect.bottom+6}px; right:${window.innerWidth-rect.right}px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); padding:5px; z-index:600; min-width:140px;`;
    const opts = [['light','sun','Chiaro'],['dark','moon','Scuro'],['system','monitor','Sistema']];
    pop.innerHTML = opts.map(([val,ic,label]) => `
      <div class="cmdk-item" data-theme-val="${val}" style="${AppState.theme===val?'background:var(--accent-soft);color:var(--accent);':''}">
        ${icon(ic,15)}<span>${label}</span>
      </div>`).join('');
    document.body.appendChild(pop);
    pop.querySelectorAll('[data-theme-val]').forEach(o => {
      o.addEventListener('click', () => {
        AppState.setTheme(o.dataset.themeVal);
        pop.remove();
        Router.render();
      });
    });
    setTimeout(()=> document.addEventListener('click', function h(e){
      if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('click', h); }
    }), 10);
  }
};

/* ============================================================
   MOBILE BOTTOM NAV
   ============================================================ */
const MobileBottomNav = {
  init(){
    document.querySelectorAll('#mobile-bottom-nav [data-mobile-nav]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.mobileNav;
        if(target === 'menu'){ MobileNav.open(); return; }
        Router.go(target);
      });
    });
    this.sync();
  },
  sync(){
    const current = AppState.route.page;
    document.querySelectorAll('#mobile-bottom-nav [data-mobile-nav]').forEach(btn => {
      const target = btn.dataset.mobileNav;
      const active = (target === current) || (target === 'subjects' && current === 'subject') ||
        (target === 'lessons-all' && ['lesson','lessons-pinned'].includes(current));
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-current', active ? 'page' : 'false');
    });
  }
};

/* ============================================================
   ROUTER
   ============================================================ */
const Router = {
  go(page, params={}){
    AppState.route = { page, params };
    MobileNav.close();
    this.render();
  },
  async resync(){
    if(AppState.isMobileFolder){
      SetupScreen.pickMobileFolder();
      return;
    }
    if(!AppState.dirHandle) return;
    Toast.info('Sincronizzazione in corso…');
    try{
      const lib = await LibraryScanner.scan(AppState.dirHandle);
      AppState.library = lib;
      this.render();
      Toast.success('Sincronizzazione completata');
      ContentIndex.invalidate();
    }catch(err){
      console.error(err);
      Toast.error('Impossibile sincronizzare la cartella.');
    }
  },
  render(){
    SidebarView.render();
    const page = AppState.route.page;
    const pages = {
      'dashboard': DashboardPage,
      'subjects': SubjectsPage,
      'subject': SubjectPage,
      'lesson': LessonPage,
      'lessons-all': LessonsAllPage,
      'lessons-pinned': LessonsAllPage,
      'files-all': FilesKindPage,
      'files-trascrizioni': FilesKindPage,
      'files-appunti': FilesKindPage,
      'files-latex': FilesKindPage,
      'files-pdf': FilesKindPage,
      'prompts': PromptsPage,
      'search': SearchPage,
      'tags': TagsPage,
      'calendar': CalendarPage,
      'activity': ActivityPage,
      'statistics': StatisticsPage,
      'export': ExportPage,
      'settings': SettingsPage,
      'editor': EditorPage
    };
    const view = pages[page] || DashboardPage;
    view.render(AppState.route.params);
    MobileBottomNav.sync();
  }
};

/* ============================================================
   SEMESTERS ENGINE — calendario Politecnico di Milano
   ============================================================ */
const POLIMI_ACADEMIC_CALENDARS = {
  '2026/2027': {
    label: 'A.A. 2026/2027',
    first:  { start:'2026-09-14', teachingEnd:'2026-12-23', examEnd:'2027-02-20' },
    second: { start:'2027-02-22', teachingEnd:'2027-06-05', examEnd:'2027-07-24' }
  }
};
function parseISODateLocal(value){
  if(value instanceof Date && !isNaN(value)) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));
  if(!m) return null;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  return isNaN(d) ? null : d;
}
function academicYearForDate(date=new Date()){
  const d = date instanceof Date ? date : new Date(date);
  const y = d.getFullYear();
  const month = d.getMonth()+1;
  return month >= 9 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function getAcademicCalendar(year=academicYearForDate()){
  return POLIMI_ACADEMIC_CALENDARS[year] || POLIMI_ACADEMIC_CALENDARS['2026/2027'];
}
function semesterDateRange(year, semester){
  const cal = getAcademicCalendar(year);
  return semester === '2' ? cal.second : cal.first;
}
function semesterForDate(date, year=academicYearForDate()){
  const d = date instanceof Date ? date : new Date(date);
  if(isNaN(d)) return null;
  const cal = getAcademicCalendar(year);
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const secondStart = parseISODateLocal(cal.second.start).getTime();
  const firstStart = parseISODateLocal(cal.first.start).getTime();
  if(t >= firstStart && t < secondStart) return '1';
  if(t >= secondStart) return '2';
  return null;
}
function getCurrentSemesterContext(date=new Date()){
  const academicYear = academicYearForDate(date);
  const calendar = getAcademicCalendar(academicYear);
  const d = date instanceof Date ? date : new Date(date);
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const semester = t >= parseISODateLocal(calendar.second.start).getTime() ? '2' : '1';
  return { academicYear, calendar, semester, range: semester === '2' ? calendar.second : calendar.first };
}
function normalizeSemester(value){
  const v = String(value ?? '').trim().toLowerCase();
  if(['1','1°','primo','primo semestre','first','first semester'].includes(v)) return '1';
  if(['2','2°','secondo','secondo semestre','second','second semester'].includes(v)) return '2';
  return null;
}
function semesterLabel(semester){ return semester === '2' ? '2° semestre' : '1° semestre'; }
function formatSemesterDates(year, semester){
  const r = semesterDateRange(year, semester);
  const f = d => new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}).format(parseISODateLocal(d));
  return `${f(r.start)} → esami fino al ${f(r.examEnd)}`;
}
function inferSubjectSemester(lessons){
  const counts = {'1':0,'2':0};
  for(const l of lessons || []){
    if(!l?.date) continue;
    const ly = academicYearForDate(l.date);
    const sem = semesterForDate(l.date, ly);
    if(sem && counts[sem] != null) counts[sem]++;
  }
  if(counts['1'] || counts['2']) return counts['2'] > counts['1'] ? '2' : '1';
  return getCurrentSemesterContext().semester;
}
function ensureSubjectSemester(subject){
  if(!subject) return;
  const datedLesson = (subject.lessons || []).find(l => l.date);
  subject.academicYear = subject.academicYear || (datedLesson ? academicYearForDate(datedLesson.date) : getCurrentSemesterContext().academicYear);
  subject.semester = normalizeSemester(subject.semester) || inferSubjectSemester(subject.lessons || []);
}
function subjectIsCurrent(subject){
  ensureSubjectSemester(subject);
  const ctx = getCurrentSemesterContext();
  return subject.academicYear === ctx.academicYear && subject.semester === ctx.semester;
}
function visibleSubjectGroups(subjects){
  const ctx = getCurrentSemesterContext();
  const current = [], previous = [], upcoming = [];
  (subjects || []).forEach(s=>{
    ensureSubjectSemester(s);
    if(s.academicYear === ctx.academicYear && s.semester === ctx.semester){
      current.push(s);
    } else if(s.academicYear === ctx.academicYear && s.semester === (ctx.semester === '2' ? '1' : '2')){
      if(ctx.semester === '2') previous.push(s); else upcoming.push(s);
    } else {
      previous.push(s);
    }
  });
  return { ctx, current, previous, upcoming };
}
async function persistSubjectMeta(subject){
  if(!subject?.handle) return;
  try{
    const metaHandle = await FileSystemManager.getOrCreateFile(subject.handle, '.subject.json');
    let existing = {};
    try{ existing = JSON.parse(await FileSystemManager.readTextFile(metaHandle)); }catch(e){}
    existing.semester = normalizeSemester(subject.semester) || getCurrentSemesterContext().semester;
    existing.academicYear = subject.academicYear || getCurrentSemesterContext().academicYear;
    existing.docente = subject.docente || '';
    existing.codice = subject.codice || '';
    existing.aula = subject.aula || '';
    existing.color = subject.color || pickColor(subject.name);
    await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(existing, null, 2));
  }catch(e){ console.warn('Salvataggio semestre materia fallito', e); }
}

            <div class="semester-section-head"><div><div class="semester-kicker">In arrivo</div><div class="semester-section-title">Prossimo semestre</div><div class="semester-section-sub">Queste materie diventeranno principali all'avvio del prossimo semestre.</div></div><span class="semester-muted-badge">${groups.upcoming.length}</span></div>
            <div class="grid grid-subjects">${groups.upcoming.map(s=>this.card(s,'upcoming')).join('')}</div>
          </section>` : ''}
        ${groups.previous.length ? `
          <section class="semester-section previous-semester-section">
            <div class="semester-section-head"><div><div class="semester-kicker">Archivio</div><div class="semester-section-title">Semestri precedenti</div><div class="semester-section-sub">Le materie concluse restano sempre accessibili.</div></div><span class="semester-muted-badge">${groups.previous.length} material${groups.previous.length===1?'e':'i'}</span></div>
            <div class="grid grid-subjects">${groups.previous.map(s=>this.card(s,'previous')).join('')}</div>
          </section>` : ''}
      </div>
    `;
    document.getElementById('btn-new-subject')?.addEventListener('click', () => SubjectFormModal.open());
    document.getElementById('empty-new-subject')?.addEventListener('click', () => SubjectFormModal.open());
    content.querySelectorAll('[data-open-subject]').forEach(elm => elm.addEventListener('click', () => Router.go('subject',{subjectName:elm.dataset.openSubject})));
  },
  card(s,state='current'){
    ensureSubjectSemester(s);
    const stats = subjectStats(s);
    const previous = state === 'previous';
    const upcoming = state === 'upcoming';
    return `
      <div class="card card-hover subject-card semester-subject-card ${previous?'is-previous':''} ${upcoming?'is-upcoming':''}" data-open-subject="${esc(s.name)}">
        <div class="subject-card-top">
          <div style="display:flex;gap:9px;align-items:flex-start;min-width:0;">
            <div class="subject-dot" style="background:${s.color}"></div>
            <div style="min-width:0;">
              <div class="subject-name">${esc(s.name)}</div>
              <div class="subject-meta">${semesterLabel(s.semester)} · ${esc(s.academicYear||'')}${[s.docente,s.codice].filter(Boolean).length?' · '+[s.docente,s.codice].filter(Boolean).join(' · '):''}</div>
            </div>
          </div>
          ${previous?`<span class="semester-archive-chip">${icon('clock',11)} Precedente</span>`:upcoming?`<span class="semester-upcoming-chip">In arrivo</span>`:`<span class="semester-now-dot"></span>`}
        </div>
        <div class="subject-stats">
          <div><div class="subject-stat-num">${stats.total}</div><div class="subject-stat-label">Lezioni</div></div>
          <div><div class="subject-stat-num" style="color:var(--success)">${stats.complete}</div><div class="subject-stat-label">Complete</div></div>
          <div><div class="subject-stat-num">${stats.pct}%</div><div class="subject-stat-label">Completamento</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${stats.pct}%;background:${s.color}"></div></div>
      </div>
    `;
  }
};

const SubjectFormModal = {
  open(){
    const m = ModalManager.open(`
      <div class="modal-header"><div class="modal-title">Nuova materia</div>
        <button class="icon-btn" id="m-close">${icon('x',16)}</button></div>
      <div class="modal-body">
        <div class="field"><label>Nome materia</label><input id="f-name" placeholder="Es. Analisi Matematica 1"></div>
        <div class="field-row">
          <div class="field"><label>Docente</label><input id="f-docente" placeholder="Facoltativo"></div>
          <div class="field"><label>Codice corso</label><input id="f-codice" placeholder="Facoltativo"></div>
        </div>
        <div class="field"><label>Aula</label><input id="f-aula" placeholder="Facoltativo"></div>
        <div class="field"><label>Semestre</label><select id="f-semester"><option value="1" ${getCurrentSemesterContext().semester==='1'?'selected':''}>1° semestre</option><option value="2" ${getCurrentSemesterContext().semester==='2'?'selected':''}>2° semestre</option></select><div class="field-hint">Preimpostato sul semestre corrente.</div></div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="m-cancel">Annulla</button>
        <button class="btn btn-primary" id="m-create">Crea materia</button>
      </div>
    `);
    m.querySelector('#m-close').onclick = () => ModalManager.close();
    m.querySelector('#m-cancel').onclick = () => ModalManager.close();
    m.querySelector('#f-name').focus();
    m.querySelector('#m-create').onclick = () => this.create(m);
    m.querySelector('#f-name').addEventListener('keydown', e => { if(e.key==='Enter') this.create(m); });
  },
  async create(m){
    const name = m.querySelector('#f-name').value.trim();
    if(!name){ Toast.error('Inserisci un nome per la materia.'); return; }
    if(findSubject(name)){ Toast.error('Esiste già una materia con questo nome.'); return; }
    if(!AppState.dirHandle){ Toast.error('Nessuna cartella collegata.'); return; }
    try{
      const handle = await FileSystemManager.createSubDir(AppState.dirHandle, name);
      const semester = normalizeSemester(m.querySelector('#f-semester')?.value) || getCurrentSemesterContext().semester;
      const academicYear = getCurrentSemesterContext().academicYear;
      const meta = { docente: m.querySelector('#f-docente').value.trim(), codice: m.querySelector('#f-codice').value.trim(), aula: m.querySelector('#f-aula').value.trim(), semester, academicYear };
      const metaHandle = await FileSystemManager.getOrCreateFile(handle, '.subject.json');
      await FileSystemManager.writeTextFile(metaHandle, JSON.stringify(meta, null, 2));
      AppState.library.subjects.push({
        id: 'subj_'+name, name, handle, docente: meta.docente, codice: meta.codice, aula: meta.aula, color: pickColor(name), semester: meta.semester, academicYear: meta.academicYear, lessons: []
      });
      AppState.library.subjects.sort((a,b)=>a.name.localeCompare(b.name,'it'));
      AppState.logActivity(name, 'Materia creata');
      ModalManager.close();
      Toast.success('Materia creata');
      Router.go('subject', { subjectName: name });
    }catch(err){
      console.error(err);
      Toast.error('Impossibile creare la materia.');
    }
  }
};

  activeTab: 'lezioni',
  sortBy: 'numero',
  statusFilter: 'all',
  render(params){

        </div>
        <div id="subject-tab-content"></div>
      </div>
    `;

    content.querySelectorAll('[data-tab]').forEach(t => t.addEventListener('click', () => { this.activeTab = t.dataset.tab; this.render(params); }));
    document.getElementById('btn-new-lesson').addEventListener('click', () => LessonFormModal.open(s.name));
    document.getElementById('btn-edit-subject').addEventListener('click', () => SubjectEditModal.open(s));
    this.renderTab(s);
    this.ensurePageCounts(s);
  },

  /** Calcola in background (senza bloccare la UI) il numero di pagine dei mainFile PDF non ancora in cache,
      poi aggiorna la card "Pagine totali" quando finisce. */
  async ensurePageCounts(s){
    await ensureStatsPageCounts(s.lessons, () => {
      if(AppState.route.page === 'subject' && AppState.route.params.subjectName === s.name) this.render(AppState.route.params);
    });
  },

  renderTab(s){
    const el = document.getElementById('subject-tab-content');
    if(this.activeTab === 'lezioni'){
      const sorters = {
        numero: (a,b) => (a.number??999) - (b.number??999),
        data: (a,b) => (b.date?.getTime()||0) - (a.date?.getTime()||0),
        nome: (a,b) => (a.title||a.folderName).localeCompare(b.title||b.folderName, 'it'),
        manuale: (a,b) => (a.order ?? 9999) - (b.order ?? 9999) || (a.number??999) - (b.number??999)
      };
      const isManual = this.sortBy === 'manuale';
      const sorted = s.lessons.slice().sort((a,b) => (isManual ? 0 : (b.pinned - a.pinned)) || sorters[this.sortBy](a,b));
      const statusFiltered = this.statusFilter==='all' ? sorted : sorted.filter(l => lessonStatus(l) === this.statusFilter);
      const chips = [
        { key:'all', label:'Tutte' },
        { key:'complete', label:'Complete' },
        { key:'progress', label:'In lavorazione' },
        { key:'missing', label:'Mancanti' }
      ];
      el.innerHTML = s.lessons.length ? `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${chips.map(c => `<button class="btn btn-sm ${this.statusFilter===c.key?'btn-primary':''}" data-status-filter="${c.key}">${esc(c.label)}</button>`).join('')}
          </div>
          <select id="lesson-sort" class="btn btn-sm" style="cursor:pointer;">
            <option value="numero" ${this.sortBy==='numero'?'selected':''}>Ordina per numero</option>
            <option value="data" ${this.sortBy==='data'?'selected':''}>Ordina per data</option>
            <option value="nome" ${this.sortBy==='nome'?'selected':''}>Ordina per nome</option>
            <option value="manuale" ${this.sortBy==='manuale'?'selected':''}>Ordine manuale (trascina)</option>
          </select>
        </div>
        ${isManual ? `<div class="muted" style="font-size:12px; margin-bottom:8px;">${icon('layers',12)} Trascina le lezioni per riordinarle manualmente.</div>` : ''}
        <div class="card" id="lezioni-list" style="padding:6px 14px;">${statusFiltered.map(l=>`<div data-lesson-id="${esc(l.id)}" draggable="${isManual}">${LessonRow.render(l)}</div>`).join('') || `<div class="muted" style="padding:16px;">Nessuna lezione con questo stato.</div>`}</div>` : `
        <div class="empty-state card">${icon('lesson',34)}<div class="empty-state-title">Nessuna lezione</div><div class="empty-state-sub">Aggiungi la prima lezione di ${esc(s.name)}.</div></div>`;
      LessonRow.bind(el);
      el.querySelectorAll('[data-status-filter]').forEach(b => b.addEventListener('click', () => { this.statusFilter = b.dataset.statusFilter; this.renderTab(s); }));
      const sortSel = document.getElementById('lesson-sort');
      if(sortSel) sortSel.addEventListener('change', () => { this.sortBy = sortSel.value; this.renderTab(s); });
      if(isManual) this.bindManualReorder(el, s);
    } else if(this.activeTab === 'prompt'){
      PromptsPage.renderInline(el, s.name);
    } else if(this.activeTab === 'file'){
      const allFiles = [];
      s.lessons.forEach(l => { Object.values(l.files).flat().forEach(f => allFiles.push({f, lesson:l})); });
      el.innerHTML = allFiles.length ? `<div class="card" style="padding:6px 14px;">${allFiles.map(({f,lesson}) => `
        <div class="lesson-row" data-open-file="${lesson.subjectName}::${lesson.id}::${esc(f.name)}">
          <div class="lesson-files">${FileTypeIcon.chip(f.kind)}</div>
          <div class="lesson-info"><div class="lesson-title">${esc(f.name)}</div><div class="lesson-date">${esc(lessonDisplayName(lesson))}</div></div>
        </div>`).join('')}</div>` : `<div class="empty-state card">${icon('file',34)}<div class="empty-state-title">Nessun file</div><div class="empty-state-sub">I file delle lezioni appariranno qui.</div></div>`;
      el.querySelectorAll('[data-open-file]').forEach(row => row.addEventListener('click', () => {
        const [subjectName, lessonId, fileName] = row.dataset.openFile.split('::');
        const lesson = findLesson(subjectName, lessonId);
        const f = Object.values(lesson.files).flat().find(x=>x.name===fileName);
        if(f) FileViewer.open(lesson, f);
      }));

    }
  },

  bindManualReorder(el, s){
    const list = document.getElementById('lezioni-list');
    if(!list) return;
    let dragEl = null;
    list.querySelectorAll('[data-lesson-id]').forEach(item => {
      item.addEventListener('dragstart', () => { dragEl = item; item.style.opacity = '0.4'; });
      item.addEventListener('dragend', () => { item.style.opacity = ''; });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if(!dragEl || dragEl === item) return;
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        list.insertBefore(dragEl, before ? item : item.nextSibling);
      });
      item.addEventListener('drop', async (e) => {
        e.preventDefault();
        const ids = [...list.querySelectorAll('[data-lesson-id]')].map(x => x.dataset.lessonId);
        try{
          await Promise.all(ids.map((id, idx) => {
            const lesson = findLesson(s.name, id);
            return lesson ? LibraryScanner.saveOrder(lesson, idx) : Promise.resolve();
          }));
          Toast.success('Ordine aggiornato');
        }catch(err){ console.error(err); Toast.error('Impossibile salvare il nuovo ordine.'); }
      });
    });
  }
};

const FileTypeIcon = {

    trascrizione: { icon:'transcript', bg:'accent-soft', color:'accent' },
    appunti: { icon:'notes', bg:'accent-soft', color:'accent' },
    latex: { icon:'latex', bg:'accent-soft', color:'accent' },
    pdf: { icon:'pdf', bg:'accent-soft', color:'accent' },
    testo: { icon:'file', bg:'accent-soft', color:'accent' },
    altro: { icon:'file', bg:'accent-soft', color:'accent' }
  },
  chip(kind){
    return `<div class="file-chip on">${icon(this.metaFor(kind).icon,12)}</div>`;
  },
  metaFor(kind){
    const map = { audio:'registrazione', text:'testo', pdf:'pdf', code:'latex', other:'altro' };
